<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imprint and privacy – LabScale</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex,follow">
<style>
:root{--bg:#fbfbf9;--ink:#0e1424;--mut:#5d6679;--line:#e2e5ea;--cob:#2563eb;color-scheme:light}@media (prefers-color-scheme:dark){:root{--bg:#0a0e1a;--ink:#e9edf8;--mut:#9aa4bd;--line:#222b44;--cob:#5b9bff;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{border-bottom:1px solid var(--line)}header div,main{max-width:820px;margin:0 auto;padding:0 24px}header div{display:flex;align-items:center;gap:20px;height:60px}
a{color:var(--cob)}.logo{font-weight:650;font-size:19px;color:var(--ink);text-decoration:none}.logo b{color:var(--cob)}header .sp{flex:1}
h1{font-size:34px;letter-spacing:-.02em;margin:40px 0 6px}h4{margin:22px 0 4px;font-size:17px}p{margin:6px 0 10px;color:var(--ink)}hr{border:0;border-top:1px solid var(--line);margin:34px 0}
nav.t{display:flex;gap:10px;margin:14px 0 6px;flex-wrap:wrap}nav.t a{border:1px solid var(--line);border-radius:999px;padding:5px 14px;text-decoration:none;color:var(--mut);font-size:14px}nav.t a:hover{color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}.note{color:var(--mut);font-size:14px}footer{max-width:820px;margin:40px auto;padding:0 24px;color:var(--mut);font-size:14px}
</style>
</head>
<body>
<header><div><a class="logo" href="./"><img src="favicon.svg" width="28" height="28" alt="" style="vertical-align:-8px;margin-right:9px;border-radius:7px">Lab<b>Scale</b></a><span class="sp"></span><a href="app.html">Open the app</a></div></header>
<main>
<h1>Imprint and privacy</h1>
<nav class="t"><a href="#imprint">Imprint</a><a href="#privacy">Privacy</a></nav>
<section id="imprint"><div id="impEn"></div></section><hr>
<section id="privacy"><div id="prEn"></div></section>
</main>
<footer><a href="./">LabScale</a></footer>
<script src="js/legal.js"></script>
<script>
document.getElementById('impEn').innerHTML=LEGAL_EN;document.getElementById('prEn').innerHTML=PRIV_EN;
</script>
</body>
</html>
