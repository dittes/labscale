<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DocScale · Lab books and documents</title>
<meta name="description" content="DocScale is a browser-based editor for lab books, reports and papers. Write LaTeX or Markdown, preview live and export to PDF, Word, HTML and more.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/paper.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="dash" class="hide"></div>

<div id="app" class="hide">
  <header id="top">
    <button class="ib ghost" id="bBack" title="Back to dashboard"></button>
    <a class="brand" href="#/" title="Dashboard"><img src="favicon.svg" width="22" height="22" alt=""><span>Doc<b>Scale</b></span></a>
    <span class="vsep"></span>
    <button class="ib ghost" id="bSide" title="Toggle file explorer"></button>
    <input type="text" id="pname" spellcheck="false" aria-label="Project name">
    <span class="stat" id="stat"><i class="dot"></i><span id="statT">Saved</span></span>
    <span class="sp"></span>
    <label class="swl hide-sm" title="Recompile automatically after you stop typing (800 ms)"><span class="sw" id="swAuto"></span>Auto-compile</label>
    <span id="cmpinfo" class="hide-sm">Not compiled</span>
    <button class="p" id="cmpbtn" title="Compile (Ctrl/Cmd+Enter)"></button>
    <span class="vsep"></span>
    <button id="bPdf" title="Download as PDF (opens the print dialog)"></button>
    <button id="bExp" title="Export to more formats"></button>
    <button class="ib" id="bRaw" title="Raw view: compiled HTML"></button>
    <button class="ib" id="bSet" title="Settings"></button>
    <span class="vsep"></span>
    <div class="seg" id="layout"><button data-v="code" title="Code only"></button><button data-v="split" title="Split view"></button><button data-v="prev" title="Preview only"></button></div>
  </header>

  <div id="body" class="v-split">
    <aside id="explorer">
      <div class="ph"><span class="tg">Files</span><button id="bNewF" title="New file"></button><button id="bNewD" title="New folder"></button><button id="bUp" title="Upload files"></button></div>
      <div id="tree"></div>
      <div class="ph"><span class="tg">Outline</span></div>
      <div id="outline"></div>
      <input type="file" id="upin" multiple hidden>
    </aside>
    <div class="spl" id="spl1"></div>

    <section id="edcol">
      <div id="tabs"></div>
      <div id="tbar"></div>
      <div id="edhost"></div>
      <div id="prob"></div>
      <div id="sbar"></div>
    </section>
    <div class="spl" id="spl2"></div>

    <section id="pv">
      <div id="pvbar">
        <button class="ib ghost" id="zOut" title="Zoom out"></button><span id="zlab" title="Click to reset to 100%">100%</span><button class="ib ghost" id="zIn" title="Zoom in"></button>
        <button class="ghost" id="zFit" title="Fit to width"></button>
        <span class="vsep"></span>
        <span id="pgin"><button class="ib ghost" id="pPrev" title="Previous page"></button><span id="pgLab">Page 1 of 1</span><button class="ib ghost" id="pNext" title="Next page"></button></span>
        <span class="sp"></span>
        <button class="ghost" id="bSync" title="Jump to the preview position of the cursor (Ctrl/Cmd+J)"></button>
      </div>
      <div id="pvs"><div id="pages"></div></div>
      <pre id="raw" class="hide"></pre>
    </section>
  </div>
</div>

<div id="measure" class="paper-text"></div>
<div id="printroot" class="paper-text"></div>
<div id="toasts"></div>

<script src="vendor/katex/katex.min.js"></script>
<script src="js/compile.js"></script>
<script src="js/templates.js"></script>
<script src="js/editor.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
