    for(let k=0;k<h;k++){Pxx[k]+=(Fa.re[k]**2+Fa.im[k]**2);if(Fb){Pyy[k]+=Fb.re[k]**2+Fb.im[k]**2;Pxy[k][0]+=Fa.re[k]*Fb.re[k]+Fa.im[k]*Fb.im[k];Pxy[k][1]+=Fa.im[k]*Fb.re[k]-Fa.re[k]*Fb.im[k]}}cnt++}

  if(Fb_(y2v)){const coh=Pxy.map((q,k)=>(q[0]**2+q[1]**2)/(Pxx[k]*Pyy[k]||1)),ph=Pxy.map(q=>Math.atan2(q[1],q[0]));cols.push({name:'Coherence',d:coh},{name:'Phase',unit:'rad',d:ph});series.push([0,2,'Coherence']);extra=KV([['Mean coherence',F(Mx.mean(coh))]])}
  function Fb_(v){return!!v}
  return{html:KV([['Segments averaged',cnt],['Segment length',seg],['Frequency resolution',F(fs/seg)]])+extra,cols,plot:{type:'line',series:[series[0]],xl:'Frequency',yl:'PSD'}}});

def('cwt','Signal','Continuous Wavelet Transform (Morlet)',[col('x','X (time) column','x'),col('y','Signal column','y'),num('fmin','Minimum frequency',1,0.5),num('fmax','Maximum frequency',50,1),num('ns','Number of scales',48,4),num('w0','Morlet ω₀',6,1)],({x:xi,y:yi,fmin,fmax,ns,w0},ctx)=>{const s=sigPrep(ctx,xi,yi);if(s.n<16)return warn('Need at least 16 points.');if(fmax>=1/(2*s.dt))fmax=.95/(2*s.dt);if(fmin>=fmax)return warn('Minimum frequency must be below the maximum.');const m=Mx.mean(s.y),N=Mx.pow2(s.n),F_=spectrum(s.y.map(v=>v-m),N),freqs=Array.from({length:Math.round(ns)},(_,i)=>fmin*Math.pow(fmax/fmin,i/(Math.round(ns)-1))),cen=(w0+Math.sqrt(2+w0*w0))/(4*Math.PI),stride=Math.max(1,Math.ceil(s.n/400)),tcols=[],tv=[];

function dwtStep(a,h){const n=a.length,L=h.length,g=h.map((v,i)=>(i%2?-1:1)*h[L-1-i]),lo=[],hi=[];for(let i=0;i<n;i+=2){let s=0,d=0;for(let k=0;k<L;k++){const v=a[(i+k)%n];s+=h[k]*v;d+=g[k]*v}lo.push(s);hi.push(d)}return{lo,hi}}

  return{html:KV([['Samples',n],['Wavelet',wav],['Levels',lev],...(out?[['Noise σ (MAD)',F(sigma)],['Threshold τ',F(tau)]]:[])])+H('Coefficient energy by level')+T(['Level','Coefficients','Energy'],[...details.map((d,l)=>['Detail '+(l+1),d.length,F(Mx.sum(d.map(v=>v*v)))]),['Approximation',a.length,F(Mx.sum(a.map(v=>v*v)))]]),cols}});

// ----- 2D FFT -----
def('fft2','Signal','2D FFT (matrix)',[cols('cols','Matrix columns','y'),chk('log','Log magnitude',true),chk('shift','Shift zero frequency to centre',true)],({cols:cs,log,shift},ctx)=>{const sh=ctx.sheet,nr=Math.max(...cs.map(c=>sh.cols[c].d.length)),nc=cs.length,R=Mx.pow2(nr),C=Mx.pow2(nc),re=Array.from({length:R},()=>new Float64Array(C)),im=Array.from({length:R},()=>new Float64Array(C));
  cs.forEach((c,j)=>{for(let r=0;r<nr;r++){const v=sh.cols[c].d[r];re[r][j]=typeof v==='number'&&Number.isFinite(v)?v:0}});
  for(let r=0;r<R;r++){const f=Mx.fft(re[r],im[r]);re[r]=f.re;im[r]=f.im}
  for(let j=0;j<C;j++){const cr=new Float64Array(R),ci=new Float64Array(R);for(let r=0;r<R;r++){cr[r]=re[r][j];ci[r]=im[r][j]}const f=Mx.fft(cr,ci);for(let r=0;r<R;r++){re[r][j]=f.re[r];im[r][j]=f.im[r]}}

<script>'use strict';

  const C=(cl,row)=>{const v=sh.cols[letters2idx(cl)]?.d[row-1];return typeof v==='number'?(Number.isNaN(v)?0:v):(v===undefined?0:v)},
    R=(a,r1,b,r2)=>{const c1=letters2idx(a),c2=letters2idx(b),o=[];for(let c=Math.min(c1,c2);c<=Math.max(c1,c2);c++)for(let r=Math.min(r1,r2);r<=Math.max(r1,r2);r++){const v=sh.cols[c]?.d[r-1];o.push(typeof v==='number'?v:NaN)}return o};

    ex=ex.replace(/\$?([A-Z]{1,3})\$?(\d+):\$?([A-Z]{1,3})\$?(\d+)/g,(m,a,b1,cc,d)=>`R("${a}",${b1},"${cc}",${d})`).replace(/(?<![A-Za-z_"\d])\$?([A-Z]{1,3})\$?(\d+)(?![\d(A-Za-z])/g,(m,a,b1)=>`C("${a}",${b1})`);

    catch(e){sh.cellErr[k]=e.message;const col=sh.cols[c];while(col.d.length<=r)col.d.push(NaN);col.d[r]=NaN}})}
function updFormulaBar(){const sh=curSheet(),fx=$('#fx');if(!sh||!fx)return;$('#fcell').textContent=`${L(cur.c)}${cur.r+1}`;if(document.activeElement===fx)return;const v=sh.cols[cur.c]?.d[cur.r],f=sh.cellF&&sh.cellF[cur.r+','+cur.c];fx.value=f||(v===undefined||(typeof v==='number'&&Number.isNaN(v))?'':String(v))}

// ---------- conditional formatting ----------
function cfEvaluator(sh){const rules=sh.cfRules;if(!rules||!rules.length)return null;const memo={};
  const stats=c=>memo[c]||(memo[c]=(()=>{const v=sh.cols[c].d.filter(x=>typeof x==='number'&&Number.isFinite(x)),cnt=new Map();v.forEach(x=>cnt.set(x,(cnt.get(x)||0)+1));return{lo:Math.min(...v),hi:Math.max(...v),cnt}})());
  return(c,v,r)=>{let out='';for(const q of rules){if(q.cols!=='all'&&!q.cols.includes(c))continue;if(typeof v!=='number'&&q.type!=='text')continue;let hit=false,bg=q.color;
      switch(q.type){case'gt':hit=v>q.a;break;case'lt':hit=v<q.a;break;case'ge':hit=v>=q.a;break;case'le':hit=v<=q.a;break;case'eq':hit=v===q.a;break;case'ne':hit=v!==q.a;break;case'between':hit=v>=q.a&&v<=q.b;break;
        case'dup':hit=Number.isFinite(v)&&stats(c).cnt.get(v)>1;break;case'text':hit=typeof v==='string'&&v.toLowerCase().includes(String(q.text).toLowerCase());break;
        case'heat':{if(!Number.isFinite(v))break;const s=stats(c);hit=true;bg=cmap(q.cmap||'coolwarm',(v-s.lo)/((s.hi-s.lo)||1));out+=`background:${hexRGBA2(bg,.6)};`;continue}}
      if(hit)out+=`background:${hexRGBA2(bg,.4)};`}return out}}
function hexRGBA2(col,a){if(col.startsWith('rgb('))return col.replace('rgb(','rgba(').replace(')',`,${a})`);const[r,g,b]=cssColor(col);return`rgba(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)},${a})`}

// ---------- column utilities ----------

  if(g.mcols)g.mcols=g.mcols.map(m).filter(i=>i>=0);['labelCol','sankeySrc','sankeyDst'].forEach(k=>{if(g[k]!=null)g[k]=m(g[k])<0?null:m(g[k])});if(g.slice&&g.slice.col!=null)g.slice.col=m(g.slice.col);if(g.filt&&g.filt.col>=0)g.filt.col=m(g.filt.col)})}

  if(sh.cfRules)sh.cfRules.forEach(q=>{if(q.cols!=='all')q.cols=q.cols.map(c=>map[c]).filter(c=>c!==undefined)})}
function moveSelectedCols(sh,where){const sel=selectedCols();if(!sel.length)return;const n=sh.cols.length,rest=sh.cols.map((_,i)=>i).filter(i=>!sel.includes(i));let order;
  if(where==='first')order=[...sel,...rest];else if(where==='last')order=[...rest,...sel];else{order=sh.cols.map((_,i)=>i);const dir=where==='left'?-1:1;(dir<0?sel:[...sel].reverse()).forEach(c=>{const p=order.indexOf(c),q=p+dir;if(q<0||q>=n||sel.includes(order[q]))return;[order[p],order[q]]=[order[q],order[p]]})}

// ---------- dialogs ----------
const D2={
  join(){const sh=curSheet(),others=sheetsExcept(sh);if(!others.length)return alert('Needs a second sheet.');
    dialog({title:'Join Sheets (merge on key)',fields:[{t:'sel',k:'right',label:'Sheet to join in',def:others[0].name,opts:others.map(s=>[s.name,s.name])},{t:'col',k:'lk',label:'Key column in this sheet',def:0},{t:'sel',k:'how',label:'Join type',def:'left',opts:[['left','Left (keep all rows of this sheet)'],['inner','Inner (only matching rows)'],['full','Full (all rows of both)']]}],

        snap();const rk=b.rk,inc=b.inc.filter(i=>i!==rk),idx=new Map();for(let r=0;r<NR(rs);r++){const k=keyOf(rs.cols[rk].d[r]);if(k!==''&&!idx.has(k))idx.set(k,r)}

  append(){const gs=P.sheets;if(gs.length<2)return alert('Needs two or more sheets.');dialog({title:'Append Sheets (stack rows)',sheet:{cols:[]},fields:[{t:'msel',k:'ids',label:'Sheets to append (in order)',opts:gs.map(s=>[s.id,s.name]),def:[]},{t:'chk',k:'src',label:'Add a “Source” column with the sheet name',def:true}],

  pivot(){const sh=curSheet();dialog({title:'Pivot Table',fields:[{t:'col',k:'r',label:'Row factor',def:0},{...{t:'col',k:'c',label:'Column factor (optional)'},none:true,noneLabel:'(none)',def:-1},{t:'col',k:'v',label:'Value column',def:Math.min(1,sh.cols.length-1)},{t:'sel',k:'agg',label:'Aggregate',def:'mean',opts:[['mean','Mean'],['sum','Sum'],['count','Count'],['min','Min'],['max','Max'],['median','Median'],['sd','SD']]}],
    onOk:a=>{const R=ctxFor(sh).raw(a.r),Cc=a.c>=0?ctxFor(sh).raw(a.c):null,V=sh.cols[a.v].d,rl=levelsOf(R.filter(x=>!rawBad(x))),cl=Cc?levelsOf(Cc.filter(x=>!rawBad(x))):['All'];

function pdfContentToPS(content,doc){const toks=content.match(/\((?:\\.|[^\\)])*\)|\[[^\]]*\]|\/\w+|[^\s]+/g)||[],fontMap={};doc.fonts.forEach(f=>fontMap[f.name]=f.base);let buf=[],out=[];const OP={q:'gsave',Q:'grestore',m:'moveto',l:'lineto',c:'curveto',h:'closepath',re:'rectpath',W:'clip',n:'newpath',f:'fill',S:'stroke',rg:'setrgbcolor',RG:'setrgbcolor',w:'setlinewidth',d:'setdash'};

function sheetToPDF(sh){const doc=new PDFDoc(),PW=841.89,PH=595.28,rowH=14,cw=84,perPage=Math.floor((PH-90)/rowH),colsPer=Math.floor((PW-90)/cw),n=NR(sh),stamp=new Date().toLocaleString();

      const cols=sh.cols.slice(c0,c0+colsPer);c.fillStyle='#eef0f4';c.fillRect(40,38,40+cols.length*cw,rowH*2);c.fillStyle='#000';c.font='600 8px Helvetica';cols.forEach((col,j)=>{c.fillText(((col.name||colL(c0+j))).slice(0,16),84+j*cw,38+10);c.font='7px Helvetica';c.fillText(col.unit?`[${col.unit}]`:'',84+j*cw,38+rowH+9);c.font='600 8px Helvetica'});
      c.font='8px Helvetica';for(let r=r0;r<Math.min(n,r0+perPage);r++){const y=38+rowH*2+(r-r0)*rowH;c.fillStyle='#777';c.fillText(String(r+1),44,y+10);c.fillStyle='#000';cols.forEach((col,j)=>{const v=col.d[r];if(v===undefined||(typeof v==='number'&&Number.isNaN(v)))return;c.fillText(String(typeof v==='string'?v:fmtCell(col,v)).slice(0,16),84+j*cw,y+10)})}

function sheetToSQL(sh){const t=(sh.name||'data').replace(/\W+/g,'_'),cn=sh.cols.map((c,i)=>(c.name||colL(i)).replace(/\W+/g,'_')||'col'+i),isNum=sh.cols.map(c=>c.d.every(v=>typeof v!=='string'));

const idb=(()=>{let db=null;const open=()=>db?Promise.resolve(db):new Promise((ok,no)=>{const r=indexedDB.open('labanalysis',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{db=r.result;ok(db)};r.onerror=()=>no(r.error)});
  return{put:async(k,v)=>{try{const d=await open();return new Promise(ok=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok(true);t.onerror=()=>ok(false)})}catch(e){return false}},get:async k=>{try{const d=await open();return new Promise(ok=>{const r=d.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}catch(e){return null}},del:async k=>{try{const d=await open();d.transaction('kv','readwrite').objectStore('kv').delete(k)}catch(e){}}}})();

function jsonToRows(data){if(Array.isArray(data)&&data.length&&typeof data[0]==='object'&&!Array.isArray(data[0])){const keys=[...new Set(data.flatMap(o=>Object.keys(o)))];return[keys,...data.map(o=>keys.map(k=>{const v=o[k];return v===null||v===undefined?'':typeof v==='object'?JSON.stringify(v):v}))]}

<script>'use strict';
// Matrix tools: transpose / rotate / flip / resize / expand / shrink / crop / smooth / formula / profile / gradient / normalize.
function sheetAsMatrix(sh,cs){cs=cs&&cs.length?cs:sh.cols.map((_,i)=>i);const nr=sh.isMatrix&&sh.yv?sh.yv.length:Math.max(...cs.map(c=>sh.cols[c].d.length)),z=Array.from({length:nr},(_,r)=>cs.map(c=>{const v=sh.cols[c].d[r];return typeof v==='number'?v:NaN}));
  const xv=cs.map((c,k)=>sh.isMatrix&&sh.xv?sh.xv[c]:(Number.isFinite(+sh.cols[c].name)&&sh.cols[c].name!==''?+sh.cols[c].name:k+1)),yv=Array.from({length:nr},(_,r)=>sh.isMatrix&&sh.yv?sh.yv[r]:r+1);return{z,xv,yv}}
function matrixToSheetObj(M,name,openIt=true){const cols=M.xv.map((x,j)=>({name:Mx.fmt(x,5),des:'Y',d:M.z.map(r=>r[j])}));const sh=mkSheet(name,cols,{isMatrix:true,xv:M.xv.slice(),yv:M.yv.slice()});if(openIt)openWin('sheet',sh.id);dirty();return sh}
const lerp=(a,b,t)=>a+(b-a)*t;
function resizeM(M,nx,ny){const{z,xv,yv}=M,R=z.length,C=xv.length,nxv=Array.from({length:nx},(_,j)=>lerp(xv[0],xv[C-1],nx>1?j/(nx-1):0)),nyv=Array.from({length:ny},(_,i)=>lerp(yv[0],yv[R-1],ny>1?i/(ny-1):0));
  const at=(r,c)=>z[Math.max(0,Math.min(R-1,r))][Math.max(0,Math.min(C-1,c))];const nz=nyv.map((_,i)=>{const fy=(ny>1?i/(ny-1):0)*(R-1),r0=Math.floor(fy),ty=fy-r0;return nxv.map((_,j)=>{const fx=(nx>1?j/(nx-1):0)*(C-1),c0=Math.floor(fx),tx=fx-c0;return lerp(lerp(at(r0,c0),at(r0,c0+1),tx),lerp(at(r0+1,c0),at(r0+1,c0+1),tx),ty)})});return{z:nz,xv:nxv,yv:nyv}}
const MAT_OPS={
  transpose:M=>({z:M.xv.map((_,j)=>M.yv.map((_,i)=>M.z[i][j])),xv:M.yv.slice(),yv:M.xv.slice()}),
  rot90:M=>{const R=M.z.length,C=M.xv.length;return{z:Array.from({length:C},(_,i)=>Array.from({length:R},(_,j)=>M.z[R-1-j][i])),xv:M.yv.slice(),yv:M.xv.slice()}},
  rot180:M=>({z:M.z.slice().reverse().map(r=>r.slice().reverse()),xv:M.xv.slice().reverse(),yv:M.yv.slice().reverse()}),
  rot270:M=>MAT_OPS.rot90(MAT_OPS.rot180(M)),
  flipH:M=>({z:M.z.map(r=>r.slice().reverse()),xv:M.xv.slice().reverse(),yv:M.yv.slice()}),
  flipV:M=>({z:M.z.slice().reverse(),xv:M.xv.slice(),yv:M.yv.slice().reverse()}),
  smooth:(M,o)=>{const R=M.z.length,C=M.xv.length,k=Math.max(1,Math.round(o.n||1));return{...M,z:M.z.map((row,i)=>row.map((_,j)=>{let s=0,c=0;for(let a=-k;a<=k;a++)for(let b=-k;b<=k;b++){const v=M.z[i+a]?.[j+b];if(Number.isFinite(v)){s+=v;c++}}return c?s/c:NaN}))}},
  gradient:M=>{const R=M.z.length,C=M.xv.length;return{...M,z:M.z.map((row,i)=>row.map((_,j)=>{const gx=((M.z[i][Math.min(C-1,j+1)]-M.z[i][Math.max(0,j-1)])/((M.xv[Math.min(C-1,j+1)]-M.xv[Math.max(0,j-1)])||1)),gy=((M.z[Math.min(R-1,i+1)][j]-M.z[Math.max(0,i-1)][j])/((M.yv[Math.min(R-1,i+1)]-M.yv[Math.max(0,i-1)])||1));return Math.hypot(gx,gy)}))}},
  normalize:M=>{const f=M.z.flat().filter(Number.isFinite),lo=Math.min(...f),hi=Math.max(...f);return{...M,z:M.z.map(r=>r.map(v=>(v-lo)/((hi-lo)||1)))}},
  resize:(M,o)=>resizeM(M,Math.max(2,Math.round(o.nx)),Math.max(2,Math.round(o.ny))),
  shrink:(M,o)=>{const k=Math.max(2,Math.round(o.n)),R=Math.floor(M.z.length/k),C=Math.floor(M.xv.length/k);return{z:Array.from({length:R},(_,i)=>Array.from({length:C},(_,j)=>{let s=0,c=0;for(let a=0;a<k;a++)for(let b=0;b<k;b++){const v=M.z[i*k+a][j*k+b];if(Number.isFinite(v)){s+=v;c++}}return c?s/c:NaN})),xv:Array.from({length:C},(_,j)=>Mx.mean(M.xv.slice(j*k,j*k+k))),yv:Array.from({length:R},(_,i)=>Mx.mean(M.yv.slice(i*k,i*k+k)))}},
  expand:(M,o)=>{const k=Math.max(2,Math.round(o.n));return resizeM(M,(M.xv.length-1)*k+1,(M.yv.length-1)*k+1)},
  crop:(M,o)=>{const x0=Math.min(o.x0,o.x1),x1=Math.max(o.x0,o.x1),y0=Math.min(o.y0,o.y1),y1=Math.max(o.y0,o.y1),cs=M.xv.map((x,j)=>j).filter(j=>M.xv[j]>=x0&&M.xv[j]<=x1),rs=M.yv.map((y,i)=>i).filter(i=>M.yv[i]>=y0&&M.yv[i]<=y1);if(!cs.length||!rs.length)throw new Error('Crop window contains no cells.');return{z:rs.map(i=>cs.map(j=>M.z[i][j])),xv:cs.map(j=>M.xv[j]),yv:rs.map(i=>M.yv[i])}},
  formula:(M,o)=>{const fn=Mx.compile(o.expr,['x','y','z','i','j']);return{...M,z:M.z.map((r,i)=>r.map((z,j)=>{const v=fn(M.xv[j],M.yv[i],z,i+1,j+1);return Number.isFinite(v)?v:NaN}))}},
  threshold:(M,o)=>({...M,z:M.z.map(r=>r.map(v=>v>=o.t?1:0))})};
function matrixDialog(){const sh=curSheet();if(!sh)return alert('Open a matrix (or select columns forming a matrix) first.');
  dialog({title:'Matrix Tools',sheet:sh,ok:'Apply (new sheet)',hint:'Works on a matrix sheet, or on the selected columns of a normal sheet (columns = X, rows = Y).',fields:[
    {t:'sel',k:'op',label:'Operation',def:'transpose',opts:[['transpose','Transpose'],['rot90','Rotate 90° clockwise'],['rot180','Rotate 180°'],['rot270','Rotate 270°'],['flipH','Flip horizontal'],['flipV','Flip vertical'],['smooth','Smooth (mean filter)'],['gradient','Gradient magnitude'],['normalize','Normalize 0–1'],['resize','Resize (bilinear)'],['shrink','Shrink (block average)'],['expand','Expand (interpolate)'],['crop','Crop to X/Y window'],['formula','Set values: formula z=f(x,y,z,i,j)'],['threshold','Threshold (0/1)'],['profileX','Profile along X (row at Y = value)'],['profileY','Profile along Y (column at X = value)']]},
    {t:'num',k:'n',label:'n / filter radius / factor',def:2},{t:'num',k:'nx',label:'New width (resize)',def:100},{t:'num',k:'ny',label:'New height (resize)',def:100},{t:'num',k:'x0',label:'X from / profile X',def:0},{t:'num',k:'x1',label:'X to',def:1},{t:'num',k:'y0',label:'Y from / profile Y',def:0},{t:'num',k:'y1',label:'Y to',def:1},{t:'txt',k:'expr',label:'Formula (x, y, z, i, j)',def:'z*2'},{t:'num',k:'t',label:'Threshold',def:0.5}],
    onOk:a=>{try{snap();const M=sheetAsMatrix(sh,sh.isMatrix?null:selectedCols());
      if(a.op==='profileX'||a.op==='profileY'){const horiz=a.op==='profileX',tv=horiz?a.y0:a.x0,axis=horiz?M.yv:M.xv,k=axis.reduce((b,v,i)=>Math.abs(v-tv)<Math.abs(axis[b]-tv)?i:b,0),xs=horiz?M.xv:M.yv,vs=horiz?M.z[k]:M.z.map(r=>r[k]);const ns=mkSheet(`${sh.name}_profile`,[{name:horiz?'X':'Y',des:'X',d:xs.slice()},{name:'Z',des:'Y',d:vs}]);openWin('sheet',ns.id);dirty();flash(`Profile at ${horiz?'Y':'X'} = ${Mx.fmt(axis[k],5)}`);return}
      const R=MAT_OPS[a.op](M,a);const ns=matrixToSheetObj(R,`${sh.name}_${a.op}`);gsel={c0:0,r0:0,c1:0,r1:0,extra:new Set()}}catch(e){alert('Matrix operation failed: '+e.message)}}})}
function matrixToImageDialog(){const sh=curSheet();if(!sh)return;const M=sheetAsMatrix(sh,sh.isMatrix?null:selectedCols()),f=M.z.flat().filter(Number.isFinite),lo=Math.min(...f),hi=Math.max(...f);dialog({title:'Matrix → Image',sheet:{cols:[]},ok:'Create image',fields:[{t:'sel',k:'cm',label:'Colormap',def:'viridis',opts:Object.keys(CMAPS).map(k=>[k,k])}],onOk:a=>{const w=M.xv.length,h=M.yv.length,rgba=new Uint8ClampedArray(w*h*4);M.z.forEach((r,i)=>r.forEach((v,j)=>{const c=cssColor(cmap(a.cm,(v-lo)/((hi-lo)||1))),o=(i*w+j)*4;rgba[o]=c[0]*255;rgba[o+1]=c[1]*255;rgba[o+2]=c[2]*255;rgba[o+3]=Number.isFinite(v)?255:0}));newImageFromRGBA(`${sh.name}_image`,w,h,rgba)}})}

<script>'use strict';
// Image processing: load image, grayscale/filters/threshold/profile/ROI stats, send to matrix.
const IMG_K={blur:[1,2,1,2,4,2,1,2,1],sharpen:[0,-1,0,-1,5,-1,0,-1,0],edge:[-1,-1,-1,-1,8,-1,-1,-1,-1],sobelx:[-1,0,1,-2,0,2,-1,0,1],sobely:[-1,-2,-1,0,0,0,1,2,1],emboss:[-2,-1,0,-1,1,1,0,1,2]};
function imgConv(d,w,h,k,gray){const o=new Uint8ClampedArray(d.length),s=k.reduce((a,b)=>a+b,0)||1,div=(k===IMG_K.blur)?s:1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){for(let ch=0;ch<3;ch++){let a=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const xx=Math.min(w-1,Math.max(0,x+i)),yy=Math.min(h-1,Math.max(0,y+j));a+=d[(yy*w+xx)*4+ch]*k[(j+1)*3+i+1]}o[(y*w+x)*4+ch]=gray?Math.abs(a/div):a/div}o[(y*w+x)*4+3]=d[(y*w+x)*4+3]}return o}
function imgGray(d){const o=new Uint8ClampedArray(d);for(let i=0;i<d.length;i+=4){const g=.299*d[i]+.587*d[i+1]+.114*d[i+2];o[i]=o[i+1]=o[i+2]=g}return o}
function imgThreshold(d,t){const g=imgGray(d),o=new Uint8ClampedArray(g);for(let i=0;i<g.length;i+=4)o[i]=o[i+1]=o[i+2]=g[i]>=t?255:0;return o}
function otsu(d){const h=new Array(256).fill(0);for(let i=0;i<d.length;i+=4)h[Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2])]++;const n=h.reduce((a,b)=>a+b,0);let sum=0;h.forEach((c,i)=>sum+=i*c);let sb=0,wb=0,best=0,t=0;for(let i=0;i<256;i++){wb+=h[i];if(!wb)continue;const wf=n-wb;if(!wf)break;sb+=i*h[i];const mb=sb/wb,mf=(sum-sb)/wf,v=wb*wf*(mb-mf)**2;if(v>best){best=v;t=i}}return t}
function imgInvert(d){const o=new Uint8ClampedArray(d);for(let i=0;i<d.length;i+=4){o[i]=255-d[i];o[i+1]=255-d[i+1];o[i+2]=255-d[i+2]}return o}
function imgMedian(d,w,h){const o=new Uint8ClampedArray(d);for(let y=0;y<h;y++)for(let x=0;x<w;x++)for(let c=0;c<3;c++){const a=[];for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)a.push(d[(Math.min(h-1,Math.max(0,y+j))*w+Math.min(w-1,Math.max(0,x+i)))*4+c]);a.sort((p,q)=>p-q);o[(y*w+x)*4+c]=a[4]}return o}
function imgToSheets(w,h,d,name,mode){const lum=i=>.299*d[i]+.587*d[i+1]+.114*d[i+2];
  const mk=(nm,f)=>matrixToSheetObj({z:Array.from({length:h},(_,y)=>Array.from({length:w},(_,x)=>f((y*w+x)*4))),xv:Array.from({length:w},(_,i)=>i+1),yv:Array.from({length:h},(_,i)=>i+1)},nm,false);
  const out=mode==='rgb'?[mk(name+'_R',i=>d[i]),mk(name+'_G',i=>d[i+1]),mk(name+'_B',i=>d[i+2])]:[mk(name+'_gray',lum)];openWin('sheet',out[0].id);dirty();flash(`Image → ${out.length} matri${out.length>1?'ces':'x'} (${w}×${h})`)}
function newImageFromRGBA(name,w,h,rgba){imageTool(name,w,h,rgba)}
function loadImageDialog(){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight;const sc=Math.min(1,1200/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);imageTool(f.name.replace(/\.[^.]+$/,''),w,h,x.getImageData(0,0,w,h).data);URL.revokeObjectURL(url)};im.onerror=()=>alert('Could not read image.');im.src=url};inp.click()}
function imageTool(name,w,h,rgba0){const orig=new Uint8ClampedArray(rgba0);let cur=new Uint8ClampedArray(orig);const hist=[];
  const dlg=document.createElement('dialog');dlg.className='dlg';dlg.style.cssText='max-width:900px;width:min(900px,95vw)';
  dlg.innerHTML=`<form method="dialog"><h3>Image Processing — ${name} (${w}×${h})</h3><div style="display:flex;gap:6px;flex-wrap:wrap" id="ib"></div><div style="overflow:auto;max-height:55vh;border:1px solid var(--line);background:#888"><canvas id="ic" style="display:block;cursor:crosshair"></canvas></div><p class="hint" id="ist">Drag on the image to select an ROI, shift-drag to draw a profile line.</p><div class="fb"><button value="x">Close</button></div></form>`;
  document.body.append(dlg);const cv=dlg.querySelector('#ic'),ctx=cv.getContext('2d'),st=dlg.querySelector('#ist');cv.width=w;cv.height=h;let roi=null,line=null;
  const show=()=>{ctx.putImageData(new ImageData(new Uint8ClampedArray(cur),w,h),0,0);if(roi){ctx.strokeStyle='#e33';ctx.strokeRect(roi.x,roi.y,roi.w,roi.h)}if(line){ctx.strokeStyle='#3c3';ctx.beginPath();ctx.moveTo(line[0],line[1]);ctx.lineTo(line[2],line[3]);ctx.stroke()}};
  const apply=f=>{hist.push(cur);cur=f(cur);show()};
  const lum=(d,i)=>.299*d[i]+.587*d[i+1]+.114*d[i+2];
  const acts=[['Grayscale',()=>apply(imgGray)],['Invert',()=>apply(imgInvert)],['Blur',()=>apply(d=>imgConv(d,w,h,IMG_K.blur))],['Sharpen',()=>apply(d=>imgConv(d,w,h,IMG_K.sharpen))],['Median',()=>apply(d=>imgMedian(d,w,h))],['Edges',()=>apply(d=>imgConv(d,w,h,IMG_K.edge,true))],['Sobel X',()=>apply(d=>imgConv(d,w,h,IMG_K.sobelx,true))],['Sobel Y',()=>apply(d=>imgConv(d,w,h,IMG_K.sobely,true))],['Emboss',()=>apply(d=>imgConv(d,w,h,IMG_K.emboss))],
    ['Threshold…',()=>{const t=prompt('Threshold 0–255 (blank = Otsu):','');apply(d=>imgThreshold(d,t===''||t===null?otsu(d):+t))}],['Undo',()=>{if(hist.length){cur=hist.pop();show()}}],['Reset',()=>{cur=new Uint8ClampedArray(orig);hist.length=0;show()}],
    ['ROI stats',()=>{const r=roi||{x:0,y:0,w,h},v=[];for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)v.push(lum(cur,(y*w+x)*4));if(!v.length)return;st.textContent=`ROI ${r.w}×${r.h}: mean ${Mx.fmt(Mx.mean(v),5)}, SD ${Mx.fmt(Mx.sd(v),5)}, min ${Math.min(...v).toFixed(0)}, max ${Math.max(...v).toFixed(0)}, n=${v.length}`}],
    ['Profile → sheet',()=>{if(!line)return alert('Shift-drag a profile line first.');const[x0,y0,x1,y1]=line,n=Math.max(2,Math.round(Math.hypot(x1-x0,y1-y0))),D=[],V=[];for(let i=0;i<n;i++){const t=i/(n-1),x=Math.round(x0+(x1-x0)*t),y=Math.round(y0+(y1-y0)*t);D.push(t*Math.hypot(x1-x0,y1-y0));V.push(lum(cur,(Math.min(h-1,Math.max(0,y))*w+Math.min(w-1,Math.max(0,x)))*4))}const s=mkSheet(`${name}_profile`,[{name:'Distance',des:'X',d:D},{name:'Intensity',des:'Y',d:V}]);openWin('sheet',s.id);dirty();flash('Profile sent to a new sheet')}],
    ['Gray → matrix',()=>imgToSheets(w,h,cur,name,'gray')],['RGB → 3 matrices',()=>imgToSheets(w,h,cur,name,'rgb')],['Save PNG',()=>{cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.png';a.click()})}]];

  const node={n,idx,imp:imp(idx)};if(cls){node.counts={};idx.forEach(i=>node.counts[y[i]]=(node.counts[y[i]]||0)+1);node.pred=Object.entries(node.counts).sort((a,b)=>b[1]-a[1])[0][0]}else node.pred=Mx.mean(idx.map(i=>y[i]));
  if(depth>=o.maxDepth||n<2*o.minLeaf||node.imp<1e-12)return node;let best=null;
  for(let f=0;f<X[0].length;f++){const ord=idx.slice().sort((a,b)=>X[a][f]-X[b][f]);let lc={},ls=0,lss=0,rc={},rs=0,rss=0;if(cls)ord.forEach(i=>rc[y[i]]=(rc[y[i]]||0)+1);else ord.forEach(i=>{rs+=y[i];rss+=y[i]*y[i]});
    for(let q=0;q<n-1;q++){const i=ord[q];if(cls){lc[y[i]]=(lc[y[i]]||0)+1;rc[y[i]]--}else{ls+=y[i];lss+=y[i]*y[i];rs-=y[i];rss-=y[i]*y[i]}
      const nl=q+1,nr=n-nl;if(X[ord[q]][f]===X[ord[q+1]][f]||nl<o.minLeaf||nr<o.minLeaf)continue;let cost;
      if(cls){let gl=1,gr=1;Object.values(lc).forEach(k=>gl-=(k/nl)**2);Object.values(rc).forEach(k=>gr-=(k/nr)**2);cost=(nl*gl+nr*gr)/n}else cost=((lss-ls*ls/nl)+(rss-rs*rs/nr))/n;
      if(!best||cost<best.cost-1e-12)best={f,t:(X[ord[q]][f]+X[ord[q+1]][f])/2,cost}}}
  if(!best||node.imp-best.cost<o.minGain)return node;node.f=best.f;node.t=best.t;node.gain=(node.imp-best.cost)*n;
  node.l=cartBuild(X,y,idx.filter(i=>X[i][best.f]<=best.t),depth+1,o);node.r=cartBuild(X,y,idx.filter(i=>X[i][best.f]>best.t),depth+1,o);return node}
const cartPred=(nd,x)=>nd.l?cartPred(x[nd.f]<=nd.t?nd.l:nd.r,x):nd.pred;
function cartSVG(root,names,cls){let leaves=0;const lay=(nd,d)=>{nd.d=d;if(!nd.l){nd.x=leaves++;return}lay(nd.l,d+1);lay(nd.r,d+1);nd.x=(nd.l.x+nd.r.x)/2};lay(root,0);const maxd=(nd)=>nd.l?Math.max(maxd(nd.l),maxd(nd.r)):nd.d,D=maxd(root),w=130,h=64,W=Math.max(1,leaves)*w+10,Ht=(D+1)*h*1.5+10;let s=`<svg width="${W}" height="${Ht}" style="font:11px sans-serif">`;
  const pos=nd=>[nd.x*w+w/2+5,nd.d*h*1.5+h/2+5];const draw=nd=>{const[x,y]=pos(nd);if(nd.l){[nd.l,nd.r].forEach((c,i)=>{const[cx,cy]=pos(c);s+=`<line x1="${x}" y1="${y+22}" x2="${cx}" y2="${cy-22}" stroke="#888"/><text x="${(x+cx)/2}" y="${(y+cy)/2}" fill="#666" text-anchor="middle">${i?'>':'≤'}</text>`});draw(nd.l);draw(nd.r)}
    const lab=nd.l?`${names[nd.f]} ≤ ${F(nd.t,4)}`:(cls?String(nd.pred):'ŷ = '+F(nd.pred,4)),sub=cls?(nd.l?`gini ${F(nd.imp,3)}`:Object.entries(nd.counts).map(([k,v])=>`${k}:${v}`).join(' ')):`n=${nd.n}`;

def('dtree','Multivariate','Decision Tree (CART)',[col('y','Target column','y'),cols('xs','Predictor columns','x'),sel('type','Target type',[['auto','Auto-detect'],['cls','Classification (categories)'],['reg','Regression (numeric)']],'auto'),num('maxDepth','Maximum depth',4,1),num('minLeaf','Minimum samples per leaf',5,1),num('cvk','Cross-validation folds (0 = none)',5,1)],({y,xs,type,maxDepth,minLeaf,cvk},ctx)=>{
  const raw=ctx.raw(y),Xc=xs.map(c=>ctx.vals(c)),rows=raw.map((_,i)=>i).filter(i=>raw[i]!==''&&raw[i]!=null&&Xc.every(x=>Number.isFinite(x[i])));if(rows.length<10)return warn('Need at least 10 complete rows.');
  const numeric=rows.every(i=>Number.isFinite(+raw[i])),uniq=new Set(rows.map(i=>String(raw[i]))).size,cls=type==='cls'||(type==='auto'&&(!numeric||uniq<=8)),X=rows.map(i=>Xc.map(x=>x[i])),yv=rows.map(i=>cls?String(raw[i]):+raw[i]),all=yv.map((_,i)=>i),names=xs.map(c=>ctx.name(c)),o={cls,maxDepth:Math.max(1,maxDepth),minLeaf:Math.max(1,minLeaf),minGain:1e-9};

  let perf,cv='';if(cls){const lv=[...new Set(yv)].sort(),conf=lv.map(a=>lv.map(b=>yv.filter((v,i)=>v===a&&pred[i]===b).length)),acc=Mx.sum(lv.map((_,i)=>conf[i][i]))/yv.length;perf=H('Confusion matrix (rows = actual)')+T(['',...lv.map(l=>'pred '+l)],lv.map((l,i)=>[l,...conf[i]]))+KV([['Resubstitution accuracy',F(100*acc,4)+' %']])}
  else{const m=Mx.mean(yv),sse=Mx.sum(yv.map((v,i)=>(v-pred[i])**2)),sst=Mx.sum(yv.map(v=>(v-m)**2));perf=KV([['R² (resubstitution)',F(1-sse/sst,5)],['RMSE',F(Math.sqrt(sse/yv.length))]])}
  if(cvk>=2){const K=Math.min(cvk,yv.length),pc=[];for(let f=0;f<K;f++){const tr=all.filter(i=>i%K!==f),te=all.filter(i=>i%K===f),nd=cartBuild(X,yv,tr,0,o);te.forEach(i=>pc[i]=cartPred(nd,X[i]))}

  const nodes=(nd)=>nd.l?1+nodes(nd.l)+nodes(nd.r):0,leaves=(nd)=>nd.l?leaves(nd.l)+leaves(nd.r):1;
  return{html:KV([['Type',cls?'Classification':'Regression'],['Rows used',rows.length],['Splits',nodes(root)],['Leaves',leaves(root)]])+H('Tree')+`<div style="overflow:auto;max-width:100%">${cartSVG(root,names,cls)}</div>`+H('Performance')+perf+cv+H('Variable importance')+T(['Predictor','Importance (%)'],names.map((n,i)=>[n,F(100*imp[i]/ti,4)]).sort((a,b)=>b[1]-a[1])),
    cols:[{name:'Predicted',d:cls?(()=>{const o2=full(ctx.nrows);rows.forEach((r,i)=>o2[r]=pred[i]);return o2.map(v=>Number.isNaN(v)?'':v)})():place(rows,pred,ctx.nrows)}]}});

(()=>{const old=A.defs.anova1.run;A.defs.anova1.run=(a,ctx)=>{const r=old(a,ctx);if(!r.html||r.html.includes('class="err"'))return r;const g=a.cols.map(c=>cv(ctx,c)),k=g.length,N=g.reduce((s,x)=>s+x.length,0),dfw=N-k,ssw=g.reduce((s,x)=>{const m=Mx.mean(x);return s+x.reduce((q,v)=>q+(v-m)**2,0)},0),msw=ssw/dfw,sc=[],ls=[],sd=[],m=k*(k-1)/2;

  const graphs=P.graphs.filter(g=>ok(`${g.name} ${g.title||''} ${GTYPES[g.type]||g.type} ${g.xl||''} ${g.yl||''}`)).map(g=>({t:g.name,s:`Graph · ${GTYPES[g.type]||g.type}${g.title?' · '+g.title:''}`,run:()=>openWin('graph',g.id)}));if(graphs.length)G.push({g:'Graphs',items:graphs.slice(0,8),n:graphs.length});
  const docs=[...(P.notes||[]).filter(n=>ok(n.name+' '+(n.text||''))).map(n=>({t:n.name,s:'Report note',run:()=>openWin('note',n.id)})),...(P.layouts||[]).filter(l=>ok(l.name)).map(l=>({t:l.name,s:'Layout page',run:()=>openWin('layout',l.id)}))];if(docs.length)G.push({g:'Reports and layouts',items:docs.slice(0,8),n:docs.length});
  const res=P.results.filter(r=>ok(`${r.title} ${r.where} ${String(r.html).replace(/<[^>]+>/g,' ')}`)).map(r=>({t:r.title,s:`Result · ${r.where} · ${r.time}`,run:()=>showResultCard(r.id)}));if(res.length)G.push({g:'Results',items:res.slice(0,8),n:res.length});
  const cells=[];let scanned=0;outer:for(const s of P.sheets){for(let c=0;c<s.cols.length;c++){const d=s.cols[c].d;for(let r=0;r<d.length;r++){if(++scanned>1500000)break outer;const v=d[r];if(v===''||v==null||(typeof v==='number'&&Number.isNaN(v)))continue;const txt=typeof v==='number'?String(v):String(v);if(words.every(w=>txt.toLowerCase().includes(w))||(typeof v==='number'&&words.length===1&&Mx.fmt(v).toLowerCase().includes(words[0]))){cells.push({t:txt.length>60?txt.slice(0,60)+'…':txt,s:`Cell ${L(c)}${r+1} in ${s.name}`,run:()=>gotoCell(s,r,c)});if(cells.length>=40)break outer}}}}

<script>'use strict';
// Organise: explorer with folders (drag & drop, context menus), inline rename, layout pages, report page breaks,

const SEC_NAME={sheet:'Sheets',graph:'Graphs',layout:'Layouts',note:'Reports'};

const orgSnap=label=>{histHint=label;snap();histHint=null};

// ---------- folders ----------
function foldersOf(t){const set=new Set((P.tfolders&&P.tfolders[t])||[]);listOf(t).forEach(o=>{if(o.folder)set.add(o.folder)});return[...set]}
function addFolder(t,name){P.tfolders=P.tfolders||{};const a=(P.tfolders[t]=P.tfolders[t]||[]);if(!a.includes(name))a.push(name)}
function uniqueFolder(t,base){const have=foldersOf(t);let n=base,i=2;while(have.includes(n))n=base+' '+i++;return n}

function inlineEdit(host,cur,commit){if(host.querySelector('input.renm'))return;const inp=document.createElement('input');inp.type='text';inp.className='renm';inp.value=cur;inp.setAttribute('aria-label','Rename');inp.style.width=Math.max(90,host.offsetWidth)+'px';

      const horiz=p1>p0,len=Math.abs(p1-p0),lab=ax.ticks.filter(t=>t.label&&!t.minor).sort((a,b)=>ax.map(a.v)-ax.map(b.v));

      const gap=len/(lab.length-1);
      let k=Math.max(1,Math.ceil(need/gap));
      const pos=lab.map(t=>ax.map(t.v));let tight=false;for(let i=1;i<pos.length;i++)if(Math.abs(pos[i]-pos[i-1])<need)tight=true;
      if(!tight)return ax;
      if(k<2)k=2;

      if(!cats&&!date){let best=1e9;for(let o=0;o<k;o++){let s=0;for(let i=o;i<lab.length;i+=k)s+=String(lab[i].label).length;s=s/Math.ceil((lab.length-o)/k);if(s<best-1e-9){best=s;off=o}}}

<script>// ===== Insight tools: data profile, outlier masking, colour-vision preview =====
function profStats(sh,ci){
  const c=sh.cols[ci],N=NR(sh),vals=[];let miss=0;const uniq=new Set();
  for(let r=0;r<N;r++){const v=c.d[r];if(v==null||v===''||(typeof v==='number'&&Number.isNaN(v))){miss++;continue}uniq.add(v);if(typeof v==='number')vals.push(v)}

  if(o.numeric){const s=vals.slice().sort((a,b)=>a-b),q=p=>{const i=(s.length-1)*p,f=Math.floor(i);return s[f]+(s[Math.min(f+1,s.length-1)]-s[f])*(i-f)};

    const nb=Math.min(20,Math.max(5,Math.round(Math.sqrt(s.length)))),lo=s[0],hi=s[s.length-1],w=(hi-lo)/nb||1,bins=new Array(nb).fill(0);s.forEach(v=>bins[Math.min(nb-1,Math.floor((v-lo)/w))]++);o.bins=bins}
  return o}

  const f=v=>v==null||!Number.isFinite(v)?'':(Math.abs(v)>=1e5||(v!==0&&Math.abs(v)<1e-3)?v.toExponential(2):String(+v.toPrecision(4))),N=NR(sh);

  document.body.append(d);d.addEventListener('close',()=>d.remove());d.showModal()}
function maskOutliersDialog(){
  const sh=curSheet();if(!sh||sh.isMatrix)return alert('Open a worksheet first.');
  dialog({title:'Mask outliers',ok:'Mask',sheet:sh,hint:'Rows with an outlier in any chosen column are masked: hidden from plots and analyses, but kept in the sheet. Unmask via Data ▸ Mask.',fields:[{t:'cols',k:'cols',label:'Columns',def:selectedCols()},{t:'sel',k:'m',label:'Rule',def:'iqr',opts:[['iqr','Tukey fences (1.5 × IQR)'],['iqr3','Far-out fences (3 × IQR)'],['z3','|z| > 3'],['mad','Modified z-score > 3.5 (MAD)']]}],
    onOk:a=>{const cs=[].concat(a.cols).filter(i=>sh.cols[i]);const N=NR(sh),bad=new Set();
      cs.forEach(ci=>{const idx=[],v=[];for(let r=0;r<N;r++){const x=sh.cols[ci].d[r];if(typeof x==='number'&&Number.isFinite(x)){idx.push(r);v.push(x)}}if(v.length<4)return;

    <div class="f c"><input type="checkbox" data-k="gridy" ${g.gridy?'checked':''}><label>Horizontal grid</label></div><div class="f c"><input type="checkbox" data-k="gridx" ${g.gridx?'checked':''}><label>Vertical grid</label></div>

    const ys=box.querySelector('[data-k=ys]');if(ys)ys.value=g.ys||'linear'}
  else if(cw.tab==='annotate'){
    box.innerHTML=`<p class="note" style="margin-top:0">Add text, arrows, lines and shapes with the toolbar above the chart (<b>Tools ▸ Draw shapes</b>) or here. Click an element to select it, drag to move, <b>double-click</b> text to edit it, Delete removes it.</p>
    <div class="row2"><button id="aShape">Add text / shape ▾</button></div>
    <div class="f" style="margin-top:12px"><label>Reference line</label></div><div class="two"><select id="rA"><option value="y">Horizontal (y =)</option><option value="x">Vertical (x =)</option></select><input type="text" id="rV" placeholder="value"></div><button id="rAdd">Add line</button>
    <div class="f" style="margin-top:12px"><label>Description below the chart</label><textarea rows="3" data-k="desc" placeholder="Explain what the reader should see">${esc((g.desc||'').replace(/\n?Source: .*$/,''))}</textarea></div>${T('cwSrc','Source','Data: …')}
    <div class="cwlist">${(g.refs||[]).map((r,i)=>`<span class="tag">${r.axis}=${Mx.fmt(r.v,5)}<button data-er="${i}" title="Edit">✎</button><button data-rr="${i}" title="Remove">✕</button></span>`).join('')}</div>`}
  else{
    box.innerHTML=`${cwSizeFields(g)}<p class="note" style="margin-top:-4px">Sets the size of exported images. The view above always fits your window.</p>
    <div class="f"><label>Style</label><select id="cwTpl"><option value="-1">Default</option>${BUILTIN_TPL.map((t,i)=>`<option value="${i}" ${cw.tpl===i?'selected':''}>${esc(t.name)}: ${esc(t.desc)}</option>`).join('')}</select></div>
    <div class="f"><label>Background</label><select id="cwBg"><option value="0">Light</option><option value="1" ${g.cwDark?'selected':''}>Dark</option></select></div>
    <div class="f"><label>Font size</label><input type="range" min="9" max="24" id="cwFs" value="${g.fs||12}"></div>
    <div class="f"><label>Legend</label><select data-k="legend">${[['none','Hidden'],['tr','Top right'],['tl','Top left'],['br','Bottom right'],['bl','Bottom left']].map(([v,l])=>`<option value="${v}" ${g.legend===v?'selected':''}>${l}</option>`).join('')}</select></div>`}
  cwBind(box)}
function cwSetSize(w,h){w=Math.max(200,Math.min(8000,Math.round(w)));h=Math.max(150,Math.min(8000,Math.round(h)));if(!(w>0&&h>0))return;cw.g.outSize=[w,h]}
function cwBind(box){
  box.oninput=e=>{const t=e.target,k=t.dataset.k;if(k){const g=cw.g;g[k]=t.type==='checkbox'?t.checked:t.value;if(k==='cwSrc'||k==='desc')cwSyncSrc();cwRedraw();return}
    if(t.id==='cwLw'){cw.g.lwAll=+t.value;cw.g.series.forEach(s=>s.lw=+t.value);cwRedraw()}if(t.id==='cwFs'){cw.g.fs=+t.value;cwRedraw()}
    if(t.id==='cwW'||t.id==='cwH'){cwSetSize(+box.querySelector('#cwW').value,+box.querySelector('#cwH').value);const s=box.querySelector('#cwSz');if(s)s.value=CW_SIZES.some(([v])=>v===cw.g.outSize.join('x'))?cw.g.outSize.join('x'):'custom'}};
  box.onchange=e=>{const t=e.target;
    if(t.id==='cwX'){cw.x=+t.value;cw.ys=cw.ys.filter(j=>j!==cw.x);if(!cw.ys.length){const f=cw.sh.cols.findIndex((c,i)=>i!==cw.x&&c.d.some(v=>typeof v==='number'));if(f>=0)cw.ys=[f]}cwApplyRoles();cwRebuild();return}
    if(t.dataset.y!==undefined){const i=+t.dataset.y;cw.ys=cw.ys.filter(j=>j!==i);if(t.checked)cw.ys.push(i);cw.ys.sort((a,b)=>a-b);if(!cw.ys.length){t.checked=true;cw.ys=[i]}cwApplyRoles();cwRebuild();return}
    if(t.id==='cwSz'&&t.value!=='custom'){const[w,h]=t.value.split('x').map(Number);cwSetSize(w,h);box.querySelector('#cwW').value=w;box.querySelector('#cwH').value=h}
    if(t.id==='cwTpl'){cw.tpl=+t.value;if(cw.tpl>=0)applyBuiltin(cw.g,BUILTIN_TPL[cw.tpl]);else cwBuild(cw.type);cwControls();cwRedraw();if(cw.step===3)openWin('graph',cw.gid)}
    if(t.id==='cwBg'){cw.g.cwDark=t.value==='1';cwRedraw()}
    if(t.dataset.k==='ys'||t.dataset.k==='legend'||t.dataset.k==='gridx'||t.dataset.k==='gridy'){cw.g[t.dataset.k]=t.type==='checkbox'?t.checked:t.value;cwRedraw()}};
  box.onclick=e=>{const g=cw.g,t=e.target;
    if(t.id==='aShape'){const r=t.getBoundingClientRect();popMenu(shapeMenuItems(),r.left,r.bottom+4)}
    if(t.id==='rAdd'){const v=parseFloat(box.querySelector('#rV').value);if(Number.isNaN(v))return cwMsg('Enter a numeric value');(g.refs=g.refs||[]).push({axis:box.querySelector('#rA').value,v});cwControls();cwRedraw()}
    if(t.dataset.er!==undefined){const q=g.refs[+t.dataset.er],nv=prompt('Reference line value:',q.v);if(nv!==null&&!Number.isNaN(parseFloat(nv))){q.v=parseFloat(nv);cwControls();cwRedraw()}}
    if(t.dataset.rr!==undefined){g.refs.splice(+t.dataset.rr,1);cwControls();cwRedraw()}}}
function cwSyncSrc(){const g=cw.g;g.desc=(g.desc||'').replace(/\n?Source: .*$/,'');if(g.cwSrc&&g.cwSrc.trim()){g.desc=(g.desc?g.desc+'\n':'')+'Source: '+g.cwSrc.replace(/^Source:\s*/i,'').trim()}}
function cwRebuild(){if(!cwSwitch(cw.type)){cw.g=null;(cwBuild('line')||cwBuild('scatter'))&&cwSwitch(cw.type)}cwControls();cwGallery(false)}

// ---------- step 4: publish ----------
function cwName(){return(cw.g.title||cw.name||'chart').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase()||'chart'}
function cwCanvas(mult){const g=cw.g,[W,H]=graphSize(g),k=cwPxScale(g)*(mult||1),cv=document.createElement('canvas');cv.width=g.outSize?Math.round(g.outSize[0]*(mult||1)):Math.round(W*k);cv.height=g.outSize?Math.round(g.outSize[1]*(mult||1)):Math.round(H*k);const c=cv.getContext('2d');c.scale(cv.width/W,cv.height/H);drawGraphTo(c,g,W,H,cwPal());return cv}
function cwSVGText(){const g=cw.g,[W,H]=graphSize(g),c=new SVGCtx();drawGraphTo(c,g,W,H,cwPal());return c.toSVG(W,H)}
function cwPDFBlob(){return graphsToPDF([cw.g])}
function cwStep4(b){
  b.innerHTML=`<div class="cw4"><div class="cwprev small"><canvas id="cwCv"></canvas></div><div class="cwpub">
  <h3>Publish & export</h3>
  <div class="pcard"><b>Image</b><div class="note">For reports, slides and social media. Edit the pixel size below.</div><div class="cwsz"><select id="cwSz">${CW_SIZES.map(([v,l])=>`<option value="${v}" ${(cw.g.outSize||[]).join('x')===v?'selected':''}>${l}</option>`).join('')}<option value="custom" ${CW_SIZES.some(([v])=>v===(cw.g.outSize||[]).join('x'))?'':'selected'}>Custom…</option></select><input type="number" id="cwW" min="200" max="8000" value="${cw.g.outSize[0]}"> × <input type="number" id="cwH" min="150" max="8000" value="${cw.g.outSize[1]}"> px</div><div class="row"><select id="pS"><option value="1" selected>Normal</option><option value="2">2× (high resolution)</option></select><button data-p="png">Download PNG</button><button data-p="copy">Copy image</button></div></div>
  <div class="pcard"><b>Vector & print</b><div class="note">Sharp at any size; editable in vector editors.</div><div class="row"><button data-p="svg">SVG</button><button data-p="pdf">PDF</button><button data-p="eps">EPS</button></div></div>
  <div class="pcard"><b>Web</b><div class="note">Self-contained, responsive, no server needed.</div><div class="row"><button data-p="html">Download web page (.html)</button><button data-p="embed">Copy embed code</button><button data-p="svgcode">Copy SVG code</button></div></div>
  <div class="pcard"><b>Office</b><div class="row"><button data-p="pptx">PowerPoint slide (.pptx)</button><button data-p="csv">Data as CSV</button></div></div>
  <div class="pcard"><b>Project</b><div class="note">Keep editing with the full toolset: annotations, fits, statistics, layouts.</div><div class="row"><button data-p="open" class="p">Open in workspace</button><button data-p="share">Share whole project (.html)</button></div></div>
  </div></div>`;
  cwDrawPreview();
  const pub=b.querySelector('.cwpub');pub.oninput=e=>{const t=e.target;if(t.id==='cwW'||t.id==='cwH'){cwSetSize(+pub.querySelector('#cwW').value,+pub.querySelector('#cwH').value);cwDrawPreview()}};
  pub.onchange=e=>{const t=e.target;if(t.id==='cwSz'&&t.value!=='custom'){const[w,h]=t.value.split('x').map(Number);cwSetSize(w,h);pub.querySelector('#cwW').value=w;pub.querySelector('#cwH').value=h;cwDrawPreview()}};
  b.querySelector('.cwpub').onclick=async e=>{const p=e.target.closest('[data-p]')?.dataset.p;if(!p)return;const nm=cwName();
    try{
      if(p==='png')cwCanvas(+b.querySelector('#pS').value).toBlob(bl=>{download(nm+'.png',bl);cwMsg('PNG saved')});
      else if(p==='copy'){const bl=await new Promise(r=>cwCanvas(2).toBlob(r));await navigator.clipboard.write([new ClipboardItem({'image/png':bl})]);cwMsg('Image copied')}
      else if(p==='svg'){download(nm+'.svg',new Blob([cwSVGText()],{type:'image/svg+xml'}));cwMsg('SVG saved')}
      else if(p==='pdf'){exportPDF([cw.g],nm+'.pdf');cwMsg('PDF saved')}
      else if(p==='eps'){download(nm+'.eps',graphToEPS(cw.g));cwMsg('EPS saved')}
      else if(p==='html'||p==='embed'||p==='svgcode'){const svg=cwSVGText().replace(/<svg /,'<svg style="max-width:100%;height:auto" ');
        const fig=`<figure style="margin:0;max-width:960px">${svg}</figure>`;
        if(p==='svgcode'){await navigator.clipboard.writeText(svg);cwMsg('SVG code copied')}else if(p==='embed'){await navigator.clipboard.writeText(fig);cwMsg('Embed code copied: paste it into any web page')}
        else{const doc=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(cw.g.title||cw.name)}</title><style>body{margin:0;padding:24px;background:${cwPal().bg};font-family:system-ui,sans-serif;display:flex;justify-content:center}figure{width:100%;max-width:960px}</style></head><body>${fig}</body></html>`;download(nm+'.html',new Blob([doc],{type:'text/html'}));cwMsg('Web page saved')}}
      else if(p==='pptx'){download(nm+'.pptx',pptxBlob([cw.g],cw.g.title||'LabScale'));cwMsg('PowerPoint saved')}
      else if(p==='csv'){const sh=cw.sh,N=NR(sh),q=v=>{const s=v==null||(typeof v==='number'&&Number.isNaN(v))?'':String(v);return/[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
        download(nm+'-data.csv',new Blob([[sh.cols.map((c,i)=>q(c.name||L(i))).join(',')].concat(Array.from({length:N},(_,r)=>sh.cols.map(c=>q(c.d[r])).join(','))).join('\n')],{type:'text/csv'}));cwMsg('CSV saved')}
      else if(p==='open')cwFinish();
      else if(p==='share'){cwCommit();const html=await buildStandalone(ser());download(nm+'-project.html',new Blob([html],{type:'text/html'}));cwMsg('Project file created: it contains the app and your data')}
    }catch(err){alert('That did not work: '+err.message)}}}
function cwCommit(){
  if(cw.committed)return cw.g;
  const g=cw.g;P.graphs=P.graphs.filter(x=>x.id!==cw.gid);
  if(cw.own){const i=P.sheets.indexOf(cw.sh);if(i>=0)P.sheets.splice(i,1)}
  histHint='Chart wizard';snap();histHint=null;
  if(cw.own)P.sheets.push(cw.sh);g.id=cw.gid;g.name=g.title||`${GTYPES[g.type]||g.type} ${g.id}`;g.sheetId=cw.sh.id;P.graphs.push(g);cw.committed=true;dirty();return g}
function cwFinish(){const g=cwCommit();cwClose(true);openWin('graph',g.id);if(typeof renderExplorer==='function')renderExplorer();flash('Chart added to your project')}

(function(){
  RIB.File.push(['Chart wizard',[['Chart wizard…','✦',()=>cwStart()],['Chart wizard for current sheet','✦',()=>{const s=curSheet();if(!s||s.isMatrix)return flash('Open a regular worksheet first');cwStart(s)}]]]);
  const adv=dawAdvice;dawAdvice=function(sh){const r=adv(sh);if(!sh.isMatrix&&r.p.num.length)r.out.unshift({group:'Guided',title:'Open the chart wizard',sub:'Check the data, compare chart types, annotate and publish',fn:()=>cwStart(sh)});
    const order=['Guided','Understand','Clean up','Visualise','Analyse','Not sure?'];r.out.sort((a,b)=>order.indexOf(a.group)-order.indexOf(b.group));return r};
  const da=dawAfter;dawAfter=function(){if(window.cwSuppress||cw){dawMade=[];dawArmed=0;return}
    const sh=dawMade[dawMade.length-1];let off=false;try{off=localStorage.getItem('la_daw_off')==='1'}catch(e){}
    if(sh&&!off&&!sh.isMatrix&&dawProfile(sh).num.length){dawMade=[];dawArmed=0;clearTimeout(dawPending);dawPending=null;setTimeout(()=>cwStart(sh),150);return}
    return da.apply(this,arguments)};
})();
</script>
