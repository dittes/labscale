<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabScale</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsPSJMYWJTY2FsZSI+CiAgPHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTUiIGZpbGw9IiMyNTYzZWIiLz4KICA8Y2lyY2xlIGN4PSIyOCIgY3k9IjI4IiByPSIxNiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjYiLz4KICA8cGF0aCBkPSJNNDAgNDBsMTQgMTQiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSI4IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz4KICA8cGF0aCBkPSJNMTkgMzNsNy04IDUgNiA3LTkiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSI0LjQiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPgo8L3N2Zz4K" type="image/svg+xml">
<style>:root{--bg:#eef0f4;--panel:#fff;--panel2:#f6f7f9;--ink:#1c2230;--mut:#667085;--line:#d9dde5;--acc:#2563eb;--acc2:#e3ecff;--warn:#c2410c;--ok:#15803d;--sel:rgba(37,99,235,.14);--rh:24px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1218;--panel:#171c25;--panel2:#1d232e;--ink:#e6e9ef;--mut:#8b94a5;--line:#2a313e;--acc:#5b9bff;--acc2:#1d2a42;--warn:#fb923c;--ok:#4ade80;--sel:rgba(91,155,255,.2)}}
:root[data-theme=dark]{--bg:#0e1218;--panel:#171c25;--panel2:#1d232e;--ink:#e6e9ef;--mut:#8b94a5;--line:#2a313e;--acc:#5b9bff;--acc2:#1d2a42;--warn:#fb923c;--ok:#4ade80;--sel:rgba(91,155,255,.2)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:3px 9px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.p,button.on{background:var(--acc);border-color:var(--acc);color:#fff}
select,input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:3px 6px;min-width:0}
input[type=color]{padding:0;width:26px;height:22px;border:1px solid var(--line);border-radius:4px;background:none}
.sp{flex:1}.note{color:var(--mut);font-size:12px}.err{color:var(--warn)}
#app{display:flex;flex-direction:column;height:100vh}
#top{display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-size:15px;margin-right:12px;letter-spacing:.2px}.brand b{color:var(--acc)}
#rtabs{display:flex;gap:2px;overflow:auto}
#rtabs button{border:0;background:none;padding:5px 10px;border-radius:5px;color:var(--mut)}
#rtabs button.on{background:var(--acc2);color:var(--acc);font-weight:600}
#ribbon{display:flex;gap:0;background:var(--panel2);border-bottom:1px solid var(--line);padding:4px 8px;overflow-x:auto;min-height:62px;align-items:stretch}
.rg{display:flex;flex-direction:column;border-right:1px solid var(--line);padding:0 8px}
.rg:last-child{border:0}
.rg .items{display:flex;gap:2px;flex:1;align-items:center}
.rg .gl{font-size:10px;color:var(--mut);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.rb{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid transparent;background:none;padding:3px 6px;min-width:46px;font-size:11px;white-space:nowrap}
.rb:hover{background:var(--acc2);border-color:var(--line)}
.rb .ic{display:flex;align-items:center;justify-content:center;width:26px;height:22px;font-weight:700;font-size:12px;color:var(--acc);font-family:ui-monospace,Menlo,monospace}
.rb .ic svg{width:22px;height:22px;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#body{flex:1;display:grid;grid-template-columns:200px 1fr 290px;min-height:0}
#body.noexp{grid-template-columns:0 1fr 290px}#body.noprops{grid-template-columns:200px 1fr 0}#body.noexp.noprops{grid-template-columns:0 1fr 0}
#body.noexp #explorer,#body.noprops #props{display:none}
aside{background:var(--panel);overflow:auto;min-width:0}
#explorer{border-right:1px solid var(--line)}#props{border-left:1px solid var(--line)}
.ex h5,.ph{margin:0;padding:6px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--panel2);border-bottom:1px solid var(--line);border-top:1px solid var(--line);display:flex;align-items:center}
.ex .it{display:flex;align-items:center;gap:6px;padding:4px 10px;cursor:pointer;border-left:3px solid transparent}
.ex .it:hover{background:var(--acc2)}.ex .it.on{background:var(--acc2);border-left-color:var(--acc);font-weight:600}
.ex .it span.n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex .it .x{opacity:0;border:0;background:none;padding:0 4px;color:var(--mut)}.ex .it:hover .x{opacity:1}
#center{display:flex;flex-direction:column;min-width:0;min-height:0}
#wintabs{display:flex;background:var(--panel2);border-bottom:1px solid var(--line);overflow-x:auto;min-height:30px}
#wintabs .wt{display:flex;align-items:center;gap:6px;padding:5px 10px;border-right:1px solid var(--line);cursor:pointer;color:var(--mut);white-space:nowrap}
#wintabs .wt.on{background:var(--panel);color:var(--ink);box-shadow:inset 0 2px 0 var(--acc)}
#wintabs .wt button{border:0;background:none;padding:0 2px;color:var(--mut)}
#winbody{flex:1;position:relative;min-height:0;background:var(--panel)}
.win{position:absolute;inset:0;display:flex;flex-direction:column}
.win[hidden]{display:none}
#empty{align-items:center;justify-content:center;color:var(--mut)}
/* grid */
#grid{flex:1;overflow:auto;position:relative;outline:none;background:var(--panel)}
#gt{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;table-layout:fixed}
#gt th,#gt td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:var(--rh);padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#gt thead th{position:sticky;background:var(--panel2);font-weight:500;z-index:2;text-align:left}
#gt thead tr:nth-child(1) th{top:0}#gt thead tr:nth-child(2) th{top:var(--rh)}#gt thead tr:nth-child(3) th{top:calc(var(--rh)*2)}#gt thead tr:nth-child(4) th{top:calc(var(--rh)*3)}
#gt th.rn,#gt td.rn{position:sticky;left:0;z-index:3;width:50px;min-width:50px;background:var(--panel2);color:var(--mut);text-align:right;cursor:pointer}
#gt thead th.rn{z-index:4}
#gt th.lt{font-weight:700;cursor:pointer;display:table-cell}
#gt th.lt.sc{background:var(--acc2);color:var(--acc)}
#gt th input,#gt th select{width:100%;border:0;background:transparent;padding:0;height:calc(var(--rh) - 4px);font-size:12px}
#gt th.hr-l input{font-weight:600}
#gt td{cursor:cell}
#gt td.sel{background:var(--sel)}#gt td.cur{outline:2px solid var(--acc);outline-offset:-2px}
#gt td.mk{text-decoration:line-through;color:var(--mut)}
#gt td.str{color:var(--mut);font-style:italic}
#gt td.num{text-align:right}
#ed{position:absolute;z-index:6;border:2px solid var(--acc);background:var(--panel);padding:0 5px;height:var(--rh);font:inherit}
#cmdbar{display:flex;gap:8px;align-items:center;padding:5px 8px;border-top:1px solid var(--line);background:var(--panel2)}
#cmdbar>span:first-child{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
#cmd{flex:1;font-family:ui-monospace,Menlo,monospace}
/* graph */
#gtools{display:flex;gap:4px;padding:5px 8px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
#gwrap{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#tip{position:absolute;display:none;pointer-events:none;background:var(--panel);border:1px solid var(--acc);border-radius:5px;padding:3px 7px;font-size:12px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:5}
/* props */
.pp{padding:0 0 12px}
.pp details{border-bottom:1px solid var(--line)}
.pp summary{padding:7px 10px;cursor:pointer;font-weight:600;font-size:12px;background:var(--panel2);list-style:none}
.pp summary::before{content:'▸';display:inline-block;width:14px;color:var(--mut)}.pp details[open]>summary::before{content:'▾'}
.pp .body{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.pp .r{display:flex;align-items:center;gap:6px}.pp .r>label{width:84px;color:var(--mut);font-size:12px;flex:none}
.pp .r input[type=text],.pp .r input[type=number],.pp .r select{flex:1;width:0}
.pp .r.two input{flex:1}
.pp .sr{border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:5px;background:var(--panel2)}
.pp .sr .r>label{width:auto;min-width:50px}
.pp .tag{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;margin:2px 3px 2px 0}
.pp .tag button{border:0;background:none;padding:0;color:var(--mut)}
/* results */
#results{border-top:1px solid var(--line);background:var(--panel);height:240px;display:flex;flex-direction:column;min-height:0}
#results{position:relative}#results.min{height:30px!important}#results.min #rlist{display:none}
#rGrip{position:absolute;left:0;right:0;top:-3px;height:7px;cursor:ns-resize;z-index:5}#rGrip:hover,#rGrip.drag{background:var(--acc);opacity:.35}#results.min #rGrip{display:none}
#rHide{transition:none}
#results .rh{display:flex;gap:6px;align-items:center;padding:4px 10px;background:var(--panel2);border-bottom:1px solid var(--line)}
#rlist{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.rc{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel2)}
.rc .h{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}.rc .h b{color:var(--acc)}.rc .h .x{border:0;background:none;color:var(--mut)}.rc .h{flex-wrap:wrap;align-items:center}.rc .h button{padding:0 7px;font-size:12px}.rc .h i,#gt th i{font-style:normal;color:var(--acc);margin-left:3px}
.rc h4{margin:8px 0 3px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.rc p{margin:4px 0}.eq{font-family:ui-monospace,Menlo,monospace;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 8px;margin:4px 0}
table.rt{border-collapse:collapse;margin:4px 0;font-variant-numeric:tabular-nums}
table.rt th,table.rt td{border:1px solid var(--line);padding:2px 9px;text-align:right;white-space:nowrap}
table.rt th{background:var(--panel);font-weight:600}table.rt td:first-child,table.rt th:first-child{text-align:left}
/* dialog */
dialog.dlg{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0;min-width:380px;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg form{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.dlg h3{margin:0 0 4px;font-size:15px}
.dlg .f{display:flex;flex-direction:column;gap:3px}.dlg .f label{font-size:12px;color:var(--mut)}.dlg .f.c{flex-direction:row;align-items:center;gap:8px}.dlg .f.c label{color:var(--ink)}
.dlg .fl{display:flex;flex-direction:column;gap:9px;max-height:60vh;overflow:auto}
.dlg select[multiple]{height:110px}
.dlg .fb{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.dlg .hint{font-size:12px;color:var(--mut);margin:0}
@media(max-width:1100px){#body{grid-template-columns:160px 1fr 240px}#body.noexp{grid-template-columns:0 1fr 240px}#body.noprops{grid-template-columns:160px 1fr 0}#body.noexp.noprops{grid-template-columns:0 1fr 0}}
@media(max-width:760px){#body,#body.noexp,#body.noprops{grid-template-columns:0 1fr 0}#explorer,#props{display:none}}

/* print / pdf */
#printArea{display:none}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  #app,dialog,#flash{display:none!important}
  #printArea{display:block;color:#000;background:#fff;font:12px system-ui,sans-serif}
  #printArea .pf{margin:0 0 8mm;page-break-after:always;break-after:page;text-align:center}
  #printArea .pf img{max-width:100%;max-height:176mm;width:auto}
  #printArea .pf figcaption{color:#555;font-size:10px;margin-top:2mm}
  #printArea table.rt{border-collapse:collapse}#printArea table.rt th,#printArea table.rt td{border:1px solid #bbb;background:#fff;color:#000;padding:1px 6px;text-align:right}
  #printArea table.rt th:first-child,#printArea table.rt td:first-child{text-align:left}
  #printArea .rc{border:0;border-bottom:1px solid #ccc;background:#fff;padding:6px 0;page-break-inside:avoid}
  #printArea .eq{background:#f3f4f6;border:0;font-family:monospace}#printArea .note{color:#555}#printArea h4{color:#555}
  @page{size:A4 landscape;margin:10mm}
}

/* gadgets */
#gpanel{position:absolute;right:8px;bottom:8px;width:360px;max-height:64%;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.25);display:flex;flex-direction:column;z-index:6;overflow:hidden}
#gpanel[hidden]{display:none}
#gpanel .gh{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel2);border-bottom:1px solid var(--line)}
#gpanel .gh select{max-width:170px}#gpanel .gh button{border:0;background:none}
#gpanel .gt{display:flex;flex-wrap:wrap;gap:2px;padding:5px 6px;border-bottom:1px solid var(--line)}
#gpanel .gt button{padding:1px 7px;font-size:12px;border-radius:999px}
#gpanel .gb{padding:8px 10px;overflow:auto}
#gpanel .row,#gpanel .r2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
#gpanel .r2 input{width:90px}
#gpanel canvas.mini{width:100%;height:130px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px}
#gpanel table.rt th,#gpanel table.rt td{padding:1px 6px;font-size:12px}

.tag.chipv{cursor:pointer;opacity:.55}.tag.chipv.on{opacity:1;background:var(--acc2);border-color:var(--acc)}
.pp .sr.selsh{outline:2px solid var(--acc)}
#gtools select{padding:2px 4px}

/* worksheet extras */
#fbar{display:flex;align-items:center;gap:8px;padding:3px 8px;border-bottom:1px solid var(--line);background:var(--panel2)}
#fbar #fcell{min-width:46px;text-align:center;font-weight:600;color:var(--acc)}#fbar .fxl{color:var(--mut);font-style:italic}#fbar #fx{flex:1;font-family:ui-monospace,Menlo,monospace}
#gt .hid{display:none}
#gt td.frz,#gt th.frz{position:sticky;z-index:2;background:var(--panel2)}
#gt thead th.frz{z-index:5}
#gt td.fx{box-shadow:inset 3px 0 0 var(--acc)}
#gt td.nt::after{content:'';position:absolute;top:0;right:0;border:4px solid transparent;border-top-color:#dc2626;border-right-color:#dc2626}
#gt td{position:relative}
#gt thead tr.spk th{top:calc(var(--rh)*4);height:var(--rh);padding:1px 4px}
#gt thead tr.spk canvas{width:100%;height:calc(var(--rh) - 4px);display:block}
#gt thead tr:nth-child(5) th{top:calc(var(--rh)*4)}

.ex .it.indent{padding-left:26px}.ex .fold{padding:4px 10px;cursor:pointer;color:var(--mut);font-weight:600;font-size:12px}.ex .fold:hover{background:var(--acc2)}

/* layout + notes windows */
#ltools,#ntools{display:flex;gap:4px;padding:5px 8px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap;align-items:center}
#lwrap{flex:1;overflow:auto;background:var(--bg);padding:16px}#lcv{background:#fff;box-shadow:0 2px 16px rgba(0,0,0,.25);display:block;margin:auto;cursor:default}
#nbody{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}#ntext{border:0;border-right:1px solid var(--line);padding:12px;resize:none;background:var(--panel);font:13px/1.5 ui-monospace,Menlo,monospace;outline:none}
#nprev{overflow:auto;padding:14px 18px;background:#fff;color:#111}#nprev h1,#nprev h2,#nprev h3{margin:.6em 0 .3em}#nprev table.rt th,#nprev table.rt td{border-color:#ccc;background:#fff;color:#111}#nprev img{max-width:100%}

#digi{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#digi .dtop{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#digi .dmsg{padding:5px 12px;background:var(--acc2);color:var(--acc);font-size:12px}
#digi .dwrap{flex:1;overflow:auto;padding:10px;text-align:center}#dcv{cursor:crosshair;box-shadow:0 2px 14px rgba(0,0,0,.3);background:#fff}
#pal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
#pal .pbox{width:min(640px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.4);overflow:hidden}
#pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:12px 14px;font-size:15px;background:var(--panel);outline:none}
#pal .pi{display:flex;justify-content:space-between;gap:12px;padding:7px 14px;cursor:pointer}#pal .pi.on,#pal .pi:hover{background:var(--acc2)}

/* ===== Workspaces ===== */
#tstrip{display:none}
body[data-ws=studio] #tstrip,body[data-ws=minimal] #tstrip{display:flex}
body[data-ws=minimal] #tstrip{display:none}
#center{position:relative}
#tstrip{position:absolute;left:0;top:var(--wt,34px);bottom:0;width:44px;z-index:5;flex-direction:column;align-items:center;gap:3px;padding:6px 0;background:var(--panel);border-right:1px solid var(--line)}
#tstrip i{width:24px;border-top:1px solid var(--line);margin:4px 0}
#tstrip .ts{width:34px;height:34px;border:0;border-radius:7px;background:none;color:var(--mut);font-size:16px;position:relative;cursor:pointer}
#tstrip .ts:hover{background:var(--panel2);color:var(--ink)}#tstrip .ts.on{background:var(--acc);color:#fff}
#tstrip .ts:hover::after{content:attr(data-tip);position:absolute;left:42px;top:5px;background:#111;color:#fff;padding:3px 8px;border-radius:5px;font-size:11px;white-space:nowrap;z-index:50;pointer-events:none}
body[data-ws=studio] #winbody{margin-left:44px}
body[data-ws=studio] #gtools [data-mode],body[data-ws=studio] #gtools #gGad{display:none}
body[data-ws=studio] #top,body[data-ws=minimal] #top{padding:2px 10px}
body[data-ws=studio] #rtabs button,body[data-ws=minimal] #rtabs button{padding:3px 9px;font-size:12px}
body[data-ws=studio] #rtabs button.on,body[data-ws=minimal] #rtabs button.on{background:none;color:var(--mut);font-weight:400}
body.ribopen[data-ws=studio] #rtabs button.on,body.ribopen[data-ws=minimal] #rtabs button.on{background:var(--acc2);color:var(--acc);font-weight:600}
body[data-ws=studio] #ribbon,body[data-ws=minimal] #ribbon{display:none;position:fixed;left:8px;right:8px;top:var(--toph,34px);z-index:60;border:1px solid var(--line);border-radius:0 0 10px 10px;box-shadow:0 18px 44px rgba(0,0,0,.4);min-height:0;background:var(--panel)}
body.ribopen[data-ws=studio] #ribbon,body.ribopen[data-ws=minimal] #ribbon{display:flex}
body.focus #explorer,body.focus #props,body.focus #results,body.focus #tstrip{display:none!important}
body.focus #body{grid-template-columns:0 1fr 0!important}body.focus[data-ws=studio] #winbody{margin-left:0}
body[data-ws=minimal] #results{height:30px}
#body>#explorer{grid-column:1}#body>#center{grid-column:2;min-width:0}#body>#props{grid-column:3}
body[data-ws=studio] .brand,body[data-ws=minimal] .brand{white-space:nowrap}body[data-ws=studio] #rtabs button,body[data-ws=minimal] #rtabs button{white-space:nowrap}

/* single layout: the former ribbon is replaced by menus and context bars */
#ribbon,#rtabs,#bExp,#bProps,#bRes,#bHist{display:none!important}
.kebab{border:0;background:var(--acc2);color:var(--acc);font:700 14px/1 system-ui;cursor:pointer;padding:2px 6px 5px;border-radius:5px;margin-left:2px;vertical-align:middle}.kebab:hover{background:var(--acc);color:#fff}
#rlist .rc .h [data-recalc],#rlist .rc .h [data-batch],#rlist .rc .h [data-ally],#rlist .rc .h [data-dup],#rlist .rc .h [data-rcopy]{display:none}

/* import assistant */

<script>'use strict';
// Numerical core: descriptive stats, special functions, distributions, linear algebra, FFT, splines, Levenberg-Marquardt.
const Mx={};

Mx.median=a=>Mx.quantile(Mx.sorted(a),.5);
Mx.min=a=>{let m=Infinity;for(const v of a)if(v<m)m=v;return m};
Mx.max=a=>{let m=-Infinity;for(const v of a)if(v>m)m=v;return m};

  const idx=a.map((v,i)=>i).sort((i,j)=>a[i]-a[j]),r=new Array(a.length);let tie=0;
  for(let i=0;i<idx.length;){let j=i;while(j+1<idx.length&&a[idx[j+1]]===a[idx[i]])j++;const rk=(i+j)/2+1;for(let k=i;k<=j;k++)r[idx[k]]=rk;const t=j-i+1;tie+=t*t*t-t;i=j+1}
  return{r,tie};
};

Mx.tcdf=(t,df)=>{const p=.5*Mx.betai(df/2,.5,df/(df+t*t));return t>0?1-p:p};
Mx.tp2=(t,df)=>Mx.betai(df/2,.5,df/(df+t*t)); // two-sided p
Mx.tinv=(p,df)=>{let lo=-1e4,hi=1e4;for(let i=0;i<200;i++){const m=(lo+hi)/2;if(Mx.tcdf(m,df)<p)lo=m;else hi=m}return(lo+hi)/2};
Mx.tcrit=(alpha,df)=>Mx.tinv(1-alpha/2,df);
Mx.fsf=(f,d1,d2)=>f<=0?1:Mx.betai(d2/2,d1/2,d2/(d2+d1*f));
Mx.chi2sf=(x,k)=>x<=0?1:1-Mx.gammp(k/2,x/2);

// ---- linear algebra ----
Mx.solve=(A,b)=>{const n=b.length,M=A.map((r,i)=>[...r,b[i]]);
  for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(M[r][i])>Math.abs(M[p][i]))p=r;if(Math.abs(M[p][i])<1e-300)return null;[M[i],M[p]]=[M[p],M[i]];
    for(let r=i+1;r<n;r++){const f=M[r][i]/M[i][i];for(let c=i;c<=n;c++)M[r][c]-=f*M[i][c]}}
  const x=Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=M[i][n];for(let c=i+1;c<n;c++)s-=M[i][c]*x[c];x[i]=s/M[i][i]}return x};
Mx.inv=A=>{const n=A.length,M=A.map((r,i)=>[...r,...Array.from({length:n},(_,j)=>+(i===j))]);
  for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(M[r][i])>Math.abs(M[p][i]))p=r;if(Math.abs(M[p][i])<1e-300)return null;[M[i],M[p]]=[M[p],M[i]];
    const d=M[i][i];for(let c=0;c<2*n;c++)M[i][c]/=d;
    for(let r=0;r<n;r++)if(r!==i){const f=M[r][i];if(f)for(let c=0;c<2*n;c++)M[r][c]-=f*M[i][c]}}
  return M.map(r=>r.slice(n))};
// least squares y ~ X*beta ; X is array of rows
Mx.lstsq=(X,y)=>{const n=X.length,k=X[0].length;
  const A=Array.from({length:k},(_,i)=>Array.from({length:k},(_,j)=>{let s=0;for(let r=0;r<n;r++)s+=X[r][i]*X[r][j];return s}));
  const b=Array.from({length:k},(_,i)=>{let s=0;for(let r=0;r<n;r++)s+=X[r][i]*y[r];return s});
  const Ai=Mx.inv(A);if(!Ai)return null;const beta=Ai.map(row=>row.reduce((s,v,j)=>s+v*b[j],0));
  const fit=X.map(r=>r.reduce((s,v,j)=>s+v*beta[j],0));let sse=0;for(let i=0;i<n;i++)sse+=(y[i]-fit[i])**2;

Mx.jacobi=S=>{ // eigen decomposition of symmetric matrix
  const n=S.length,A=S.map(r=>[...r]),V=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>+(i===j)));
  for(let sweep=0;sweep<100;sweep++){let off=0;for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)off+=A[i][j]**2;if(off<1e-22)break;
    for(let p=0;p<n;p++)for(let q=p+1;q<n;q++){if(Math.abs(A[p][q])<1e-300)continue;
      const th=(A[q][q]-A[p][p])/(2*A[p][q]),t=Math.sign(th||1)/(Math.abs(th)+Math.sqrt(th*th+1)),c=1/Math.sqrt(t*t+1),s=t*c;

      for(let k=0;k<n;k++){const a=A[p][k],b=A[q][k];A[p][k]=c*a-s*b;A[q][k]=s*a+c*b}
      for(let k=0;k<n;k++){const a=V[k][p],b=V[k][q];V[k][p]=c*a-s*b;V[k][q]=s*a+c*b}}}

  return{vals:ord.map(i=>A[i][i]),vecs:ord.map(i=>V.map(r=>r[i]))}};

// ---- FFT (radix-2) ----
Mx.fft=(re,im)=>{const n=re.length;re=Float64Array.from(re);im=Float64Array.from(im||new Float64Array(n));
  for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}
  for(let len=2;len<=n;len<<=1){const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let k=0;k<len/2;k++){const a=i+k,b=i+k+len/2,tr=re[b]*cr-im[b]*ci,ti=re[b]*ci+im[b]*cr;re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;const nr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=nr}}}
  return{re,im}};
Mx.pow2=n=>{let p=1;while(p<n)p<<=1;return p};

// ---- interpolation ----
Mx.spline=(x,y)=>{ // natural cubic spline; x ascending
  const n=x.length,h=[],al=[],l=[1],mu=[0],z=[0],c=new Array(n).fill(0),b=[],d=[];
  for(let i=0;i<n-1;i++)h[i]=x[i+1]-x[i];
  for(let i=1;i<n-1;i++)al[i]=3/h[i]*(y[i+1]-y[i])-3/h[i-1]*(y[i]-y[i-1]);
  for(let i=1;i<n-1;i++){l[i]=2*(x[i+1]-x[i-1])-h[i-1]*mu[i-1];mu[i]=h[i]/l[i];z[i]=(al[i]-h[i-1]*z[i-1])/l[i]}
  for(let j=n-2;j>=0;j--){c[j]=z[j]-mu[j]*c[j+1];b[j]=(y[j+1]-y[j])/h[j]-h[j]*(c[j+1]+2*c[j])/3;d[j]=(c[j+1]-c[j])/(3*h[j])}
  return q=>{let i=Math.max(0,Math.min(n-2,Mx.bsearch(x,q)));const t=q-x[i];return y[i]+b[i]*t+c[i]*t*t+d[i]*t*t*t}};
Mx.bsearch=(x,q)=>{let lo=0,hi=x.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(x[m]<=q)lo=m;else hi=m}return lo};
Mx.linterp=(x,y)=>q=>{const n=x.length;if(n===1)return y[0];const i=Math.max(0,Math.min(n-2,Mx.bsearch(x,q)));return y[i]+(y[i+1]-y[i])*(q-x[i])/(x[i+1]-x[i])};

// local polynomial fit around index i (x may be non-uniform). returns coefficients in (x-x[i]).
Mx.locpoly=(x,y,i,half,order)=>{
  const lo=Math.max(0,i-half),hi=Math.min(x.length-1,i+half),k=Math.min(order,hi-lo),X=[],Y=[];
  for(let j=lo;j<=hi;j++){const t=x[j]-x[i],row=[];for(let p=0;p<=k;p++)row.push(Math.pow(t,p));X.push(row);Y.push(y[j])}
  const r=Mx.lstsq(X,Y);return r?r.beta:[y[i],0,0]};

// ---- expression compiler for user-defined functions ----
Mx.ALIAS={ln:Math.log,log:Math.log10,sgn:Math.sign,pi:Math.PI,e:Math.E,erf:Mx.erf,gamma:Mx.gamma,gammaln:Mx.gammaln,normcdf:Mx.normcdf,step:v=>v>=0?1:0,sinc:v=>v===0?1:Math.sin(Math.PI*v)/(Math.PI*v)};
const MATHN=Object.getOwnPropertyNames(Math).filter(n=>!(n in Mx.ALIAS)&&/^[a-z]/i.test(n)&&typeof Math[n]!=='undefined');
Mx.compile=(expr,vars)=>{
  const src=expr.replace(/\^/g,'**');
  const aliasN=Object.keys(Mx.ALIAS);
  const fn=new Function(...MATHN,...aliasN,...vars,`return (${src});`);
  const base=[...MATHN.map(n=>Math[n]),...aliasN.map(n=>Mx.ALIAS[n])];
  return(...v)=>fn(...base,...v);
};
Mx.exprParams=expr=>{
  const reserved=new Set([...MATHN,...Object.keys(Mx.ALIAS),'x','Math']);const out=[];
  expr=expr.replace(/\d+\.?\d*(e[+-]?\d+)?|\.\d+/gi,'0');
  for(const m of expr.matchAll(/[A-Za-z_]\w*(?!\w)\s*(\()?/g)){const nm=m[0].replace(/\s*\($/,'').trim();if(m[1]||reserved.has(nm)||out.includes(nm))continue;out.push(nm)}
  return out};

// ---- Levenberg-Marquardt ----
Mx.lm=(f,p0,x,y,iters=500)=>{
  let p=[...p0],lam=1e-3;const n=x.length,k=p.length;
  const cost=q=>{let s=0;for(let i=0;i<n;i++){const e=y[i]-f(x[i],q);s+=e*e}return Number.isFinite(s)?s:Infinity};
  let c=cost(p),it=0;
  const jac=q=>x.map(xi=>q.map((pj,j)=>{const h=Math.max(1e-8,Math.abs(pj)*1e-6),qq=[...q];qq[j]+=h;return(f(xi,qq)-f(xi,q))/h}));
  for(;it<iters;it++){
    const J=jac(p),r=x.map((xi,i)=>y[i]-f(xi,p));
    const A=Array.from({length:k},(_,i)=>Array.from({length:k},(_,j)=>{let s=0;for(let m=0;m<n;m++)s+=J[m][i]*J[m][j];return s}));
    const g=Array.from({length:k},(_,i)=>{let s=0;for(let m=0;m<n;m++)s+=J[m][i]*r[m];return s});
    let ok=false,done=false;
    for(let t=0;t<14;t++){
      const Ad=A.map((row,i)=>row.map((v,j)=>i===j?v+lam*(v||1)+1e-14:v)),d=Mx.solve(Ad,g);
      if(!d){lam*=10;continue}
      const q=p.map((v,i)=>v+d[i]),cq=cost(q);
      if(cq<c){const rel=(c-cq)/(c||1);p=q;c=cq;lam=Math.max(lam/5,1e-12);ok=true;if(rel<1e-13)done=true;break}

    if(!ok||done)break}

  let cov=null,se=p.map(()=>NaN);
  try{const J=jac(p),A=Array.from({length:k},(_,i)=>Array.from({length:k},(_,j)=>{let s=0;for(let m=0;m<n;m++)s+=J[m][i]*J[m][j];return s})),Ai=Mx.inv(A);
    if(Ai&&n>k){const s2=c/(n-k);cov=Ai.map(r=>r.map(v=>v*s2));se=cov.map((r,i)=>Math.sqrt(Math.abs(r[i])))}}catch(e){}
  return{p,c,it,cov,se,dof:n-k};
};

// ---- number formatting ----
Mx.fmt=(v,p=6)=>{if(v===null||v===undefined||!Number.isFinite(v))return Number.isNaN(v)||v===undefined||v===null?'—':(v>0?'∞':'-∞');
  const a=Math.abs(v);if(a!==0&&(a>=1e7||a<1e-4))return v.toExponential(Math.max(p-1,1));return String(+v.toPrecision(p))};
Mx.fmtP=p=>!Number.isFinite(p)?'—':p<1e-4?'<0.0001':Mx.fmt(p,4);

// ---- studentized range (Tukey HSD) ----
Mx.fastPhi=z=>{const x=Math.abs(z)/Math.SQRT2,t=1/(1+0.3275911*x),y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return z>=0?.5*(1+y):.5*(1-y)};
Mx.ptukey=(q,k,df)=>{
  if(!(q>0))return 0;

  if(df>=1500)return Math.min(1,W(q));
  const lc=Math.log(2)+(df/2)*Math.log(df/2)-Mx.gammaln(df/2),sd=1/Math.sqrt(2*df),lo=Math.max(1e-4,1-8*sd),hi=1+8*sd,N=160,h=(hi-lo)/N;let s=0;
  for(let i=0;i<=N;i++){const t=lo+i*h,f=Math.exp(lc+(df-1)*Math.log(t)-df*t*t/2);s+=f*W(q*t)*(i===0||i===N?1:i%2?4:2)}
  return Math.min(1,s*h/3)};

// ---- dates (stored as UTC milliseconds) ----
Mx.parseDate=str=>{str=String(str).trim();let m,y,mo,d,h=0,mi=0,se=0;
  if((m=str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s]+(\d{1,2}):(\d{2})(?::(\d{2})(?:\.\d+)?)?)?\s*Z?$/))){y=+m[1];mo=+m[2];d=+m[3];h=+(m[4]||0);mi=+(m[5]||0);se=+(m[6]||0)}
  else if((m=str.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})(?:[\s,]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/))){d=+m[1];mo=+m[2];y=+m[3];h=+(m[4]||0);mi=+(m[5]||0);se=+(m[6]||0)}
  else return NaN;
  if(mo<1||mo>12||d<1||d>31||h>23||mi>59||se>59)return NaN;const t=Date.UTC(y,mo-1,d,h,mi,se);return new Date(t).getUTCDate()===d?t:NaN};
Mx.formatDate=ms=>{if(!Number.isFinite(ms))return'';const d=new Date(ms),p=n=>String(n).padStart(2,'0'),day=`${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}`;
  if(ms%864e5===0)return day;return`${day} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}${ms%6e4?':'+p(d.getUTCSeconds()):''}`};
const formatDate=Mx.formatDate,parseDate=Mx.parseDate;

// ---- Dunnett multiple-comparison distribution ----
Mx.pdunnett=(t,m,df,rho)=>{if(!(t>0))return 0;const sr=Math.sqrt(rho),sq=Math.sqrt(1-rho);
  const inner=ts=>{const N=120,h=16/N;let s=0;for(let i=0;i<=N;i++){const z=-8+i*h,p=Mx.fastPhi((ts-sr*z)/sq)-Mx.fastPhi((-ts-sr*z)/sq);s+=Math.exp(-z*z/2)/Math.sqrt(2*Math.PI)*Math.pow(Math.max(0,p),m)*(i===0||i===N?1:i%2?4:2)}return s*h/3};
  if(df>=1500)return Math.min(1,inner(t));
  const lc=Math.log(2)+(df/2)*Math.log(df/2)-Mx.gammaln(df/2),sd=1/Math.sqrt(2*df),lo=Math.max(1e-4,1-8*sd),hi=1+8*sd,N=120,h=(hi-lo)/N;let s=0;
  for(let i=0;i<=N;i++){const u=lo+i*h;s+=Math.exp(lc+(df-1)*Math.log(u)-df*u*u/2)*inner(t*u)*(i===0||i===N?1:i%2?4:2)}
  return Math.min(1,s*h/3)};
Mx.qdunnett=(p,m,df,rho)=>{let lo=0,hi=12;for(let i=0;i<40;i++){const mid=(lo+hi)/2;Mx.pdunnett(mid,m,df,rho)<p?lo=mid:hi=mid}return(lo+hi)/2};

// ---- large-data decimation ----
Mx.lttb=(P,n)=>{const N=P.length;if(n>=N||n<3)return P;const out=[P[0]],bs=(N-2)/(n-2);let a=0;
  for(let i=0;i<n-2;i++){const s=Math.floor((i+1)*bs)+1,e=Math.min(N,Math.floor((i+2)*bs)+1),ns=Math.floor((i+2)*bs)+1,ne=Math.min(N,Math.floor((i+3)*bs)+1);let ax=0,ay=0,cnt=0;
    for(let j=ns;j<ne;j++){ax+=P[j][0];ay+=P[j][1];cnt++}if(!cnt){ax=P[N-1][0];ay=P[N-1][1];cnt=1}ax/=cnt;ay/=cnt;
    let best=-1,bi=s;for(let j=s;j<e;j++){const ar=Math.abs((P[a][0]-ax)*(P[j][1]-P[a][1])-(P[a][0]-P[j][0])*(ay-P[a][1]));if(ar>best){best=ar;bi=j}}out.push(P[bi]);a=bi}
  out.push(P[N-1]);return out};
Mx.dedupe=(P,res=1)=>{const seen=new Set(),o=[];for(const p of P){const k=Math.round(p[0]/res)+':'+Math.round(p[1]/res);if(!seen.has(k)){seen.add(k);o.push(p)}}return o};

// ---- Shapiro–Wilk (Royston 1995, algorithm AS R94) ----
Mx.shapiro=x=>{const n=x.length;if(n<3||n>5000)return null;const y=Mx.sorted(x),poly=(c,t)=>c.reduce((s,v,i)=>s+v*Math.pow(t,i),0),n2=Math.floor(n/2),a=new Array(n2+1).fill(0);
  if(n===3)a[1]=Math.SQRT1_2;else{const an25=n+.25,m=[0];let summ2=0;for(let i=1;i<=n2;i++){m[i]=Mx.norminv((i-.375)/an25);summ2+=m[i]*m[i]}summ2*=2;const ss=Math.sqrt(summ2),rsn=1/Math.sqrt(n);
    const c1=[0,.221157,-.147981,-2.07119,4.434685,-2.706056],c2=[0,.042981,-.293762,-1.752461,5.682633,-3.582633];const a1=poly(c1,rsn)-m[1]/ss;let i1,fac;
    if(n>5){i1=3;const a2=-m[2]/ss+poly(c2,rsn);fac=Math.sqrt((summ2-2*m[1]**2-2*m[2]**2)/(1-2*a1*a1-2*a2*a2));a[2]=a2}else{i1=2;fac=Math.sqrt((summ2-2*m[1]**2)/(1-2*a1*a1))}
    a[1]=a1;for(let i=i1;i<=n2;i++)a[i]=-m[i]/fac}
  let s=0;for(let i=1;i<=n2;i++)s+=a[i]*(y[n-i]-y[i-1]);const mean=Mx.mean(y);let ss=0;for(const v of y)ss+=(v-mean)**2;if(!ss)return null;const w=Math.min(1,s*s/ss);let p;
  if(n===3){p=Math.max(0,6/Math.PI*(Math.asin(Math.sqrt(w))-Math.PI/3))}
  else{const yy=Math.log(1-w),xx=Math.log(n);let m_,s_;if(n<=11){const gm=-2.273+.459*n;if(yy>=gm)return{w,p:1e-99};const y2=-Math.log(gm-yy);m_=poly([.544,-.39978,.025054,-6.714e-4],n);s_=Math.exp(poly([1.3822,-.77857,.062767,-.0020322],n));p=1-Mx.normcdf((y2-m_)/s_)}
    else{m_=poly([-1.5861,-.31082,-.083751,.0038915],xx);s_=Math.exp(poly([-.4803,-.082676,.0030302],xx));p=1-Mx.normcdf((yy-m_)/s_)}}
  return{w,p}};

// ---- Nelder–Mead simplex minimiser ----
Mx.nelder=(f,x0,opt={})=>{const n=x0.length,step=opt.step||x0.map(v=>Math.abs(v)*.1||.1),maxit=opt.maxit||2000,tol=opt.tol||1e-10;let S=[x0.slice()];for(let i=0;i<n;i++){const p=x0.slice();p[i]+=step[i];S.push(p)}let F=S.map(f);
  for(let it=0;it<maxit;it++){const o=F.map((_,i)=>i).sort((a,b)=>F[a]-F[b]);S=o.map(i=>S[i]);F=o.map(i=>F[i]);if(Math.abs(F[n]-F[0])<tol*(Math.abs(F[0])+tol))break;
    const c=Array(n).fill(0);for(let i=0;i<n;i++)for(let j=0;j<n;j++)c[j]+=S[i][j]/n;const pt=(t)=>c.map((v,j)=>v+t*(S[n][j]-v)),xr=pt(-1),fr=f(xr);
    if(fr<F[0]){const xe=pt(-2),fe=f(xe);if(fe<fr){S[n]=xe;F[n]=fe}else{S[n]=xr;F[n]=fr}}else if(fr<F[n-1]){S[n]=xr;F[n]=fr}else{const xc=pt(fr<F[n]?-.5:.5),fc=f(xc);if(fc<Math.min(fr,F[n])){S[n]=xc;F[n]=fc}else for(let i=1;i<=n;i++){S[i]=S[0].map((v,j)=>v+.5*(S[i][j]-v));F[i]=f(S[i])}}}
  return{x:S[0],f:F[0]}};
Mx.hessianSE=(f,x)=>{const n=x.length,h=x.map(v=>Math.max(Math.abs(v)*1e-4,1e-6)),H=Array.from({length:n},()=>Array(n).fill(0)),f0=f(x);

  const inv=Mx.inv(H);return inv?inv.map((r,i)=>Math.sqrt(Math.abs(r[i]))):x.map(()=>NaN)};

// ---- non-central t and F ----
Mx.pnct=(t,df,delta)=>{const sd=1/Math.sqrt(2*df),lo=Math.max(1e-5,1-9*sd),hi=1+9*sd,lc=Math.log(2)+(df/2)*Math.log(df/2)-Mx.gammaln(df/2),N=240,h=(hi-lo)/N;let s=0;
  for(let i=0;i<=N;i++){const u=lo+i*h;s+=Math.exp(lc+(df-1)*Math.log(u)-df*u*u/2)*Mx.normcdf(t*u-delta)*(i===0||i===N?1:i%2?4:2)}return Math.min(1,Math.max(0,s*h/3))};
Mx.pncf=(x,d1,d2,lam)=>{let s=0;const half=lam/2,z=d1*x/(d1*x+d2);let w=Math.exp(-half);for(let j=0;j<400;j++){s+=w*Mx.betai(d1/2+j,d2/2,z);w*=half/(j+1);if(w<1e-14&&j>half)break}return Math.min(1,s)};

// ---- distribution helpers ----
Mx.fsfInv=(p,d1,d2)=>{let lo=0,hi=1e4;for(let i=0;i<200;i++){const m=(lo+hi)/2;Mx.fsf(m,d1,d2)>p?lo=m:hi=m}return(lo+hi)/2};
Mx.chi2inv=(p,k)=>{let lo=0,hi=1e4;for(let i=0;i<200;i++){const m=(lo+hi)/2;Mx.chi2sf(m,k)>1-p?lo=m:hi=m}return(lo+hi)/2};
Mx.kolmSF=l=>{if(l<=0)return 1;let s=0;for(let k=1;k<=100;k++){const t=2*(k%2?1:-1)*Math.exp(-2*k*k*l*l);s+=t;if(Math.abs(t)<1e-12)break}return Math.min(1,Math.max(0,s))};
Mx.digamma=x=>{let r=0;while(x<6){r-=1/x;x++}const f=1/(x*x);return r+Math.log(x)-.5/x-f*(1/12-f*(1/120-f*(1/252-f*(1/240-f/132))))};
Mx.trigamma=x=>{let r=0;while(x<6){r+=1/(x*x);x++}const f=1/(x*x);return r+1/x+f/2+1/(x*x*x)*(1/6-f*(1/30-f*(1/42-f/30)))};

// ---- inverse FFT ----
Mx.ifft=(re,im)=>{const n=re.length,r=Mx.fft(re,Float64Array.from(im||new Float64Array(n),v=>-v));return{re:Float64Array.from(r.re,v=>v/n),im:Float64Array.from(r.im,v=>-v/n)}};
</script>
<script>'use strict';
// Analysis library. Each def: {id, group, label, fields, run(args, ctx)} -> {html, cols, curves, marks, sheet}
const A={defs:{},order:[]};
const F=Mx.fmt,PV=Mx.fmtP;
const T=(head,rows)=>`<table class="rt"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const KV=rows=>T(['Quantity','Value'],rows);
const H=s=>`<h4>${s}</h4>`;
const col=(k,label,role)=>({t:'col',k,label,role}),cols=(k,label,role)=>({t:'cols',k,label,role}),
  num=(k,label,def,step)=>({t:'num',k,label,def,step}),sel=(k,label,opts,def)=>({t:'sel',k,label,opts,def}),
  chk=(k,label,def)=>({t:'chk',k,label,def}),txt=(k,label,def)=>({t:'txt',k,label,def});
function def(id,group,label,fields,run){A.defs[id]={id,group,label,fields,run};A.order.push(id)}
const ALPHA=num('alpha','Significance level α',0.05,0.01);
const full=n=>new Array(n).fill(NaN);
function pairs(ctx,xi,yi){const X=ctx.vals(xi),Y=ctx.vals(yi),x=[],y=[],rows=[];
  for(let i=0;i<Math.max(X.length,Y.length);i++)if(Number.isFinite(X[i])&&Number.isFinite(Y[i])){x.push(X[i]);y.push(Y[i]);rows.push(i)}
  return{x,y,rows}}
function sortedPairs(ctx,xi,yi){const p=pairs(ctx,xi,yi),idx=p.x.map((_,i)=>i).sort((a,b)=>p.x[a]-p.x[b]);
  return{x:idx.map(i=>p.x[i]),y:idx.map(i=>p.y[i]),rows:idx.map(i=>p.rows[i])}}
const place=(rows,vals,n)=>{const o=full(n);rows.forEach((r,i)=>o[r]=vals[i]);return o};
const grid=(lo,hi,n=300)=>Array.from({length:n+1},(_,i)=>lo+(hi-lo)*i/n);
function colname(ctx,ci){return ctx.name(ci)}
function warn(msg){return{html:`<p class="err">${msg}</p>`}}

// ===================== BUILT-IN FIT MODELS =====================
const rngx=x=>Math.max(...x)-Math.min(...x)||1;
const MODELS={
  exp:{label:'Exponential  a·e^(b·x)',names:['a','b'],f:(x,p)=>p[0]*Math.exp(p[1]*x),
    init:(x,y)=>{const q=x.map((v,i)=>[v,y[i]]).filter(r=>r[1]>0);let s=[y[0]||1,1/rngx(x)];if(q.length>2){const l=Mx.lstsq(q.map(r=>[1,r[0]]),q.map(r=>Math.log(r[1])));if(l)s=[Math.exp(l.beta[0]),l.beta[1]]}return[s]}},
  expgrow:{label:'Exponential growth  y0 + A·e^(x/t)',names:['y0','A','t'],f:(x,p)=>p[0]+p[1]*Math.exp(x/p[2]),
    init:(x,y)=>[[Math.min(...y),(y[y.length-1]-y[0])/2||1,rngx(x)/2]]},
  expdec1:{label:'Exponential decay  y0 + A·e^(−x/t)',names:['y0','A','t'],f:(x,p)=>p[0]+p[1]*Math.exp(-x/p[2]),
    init:(x,y)=>{const yl=y[y.length-1];return[[yl,y[0]-yl,rngx(x)/3],[yl,y[0]-yl,rngx(x)/10]]}},
  expdec2:{label:'Biexponential decay  y0 + A1·e^(−x/t1) + A2·e^(−x/t2)',names:['y0','A1','t1','A2','t2'],f:(x,p)=>p[0]+p[1]*Math.exp(-x/p[2])+p[3]*Math.exp(-x/p[4]),
    init:(x,y)=>{const yl=y[y.length-1],a=y[0]-yl,r=rngx(x);return[[yl,a/2,r/20,a/2,r/3],[yl,a*.7,r/50,a*.3,r/5]]}},
  power:{label:'Power  a·x^b',names:['a','b'],f:(x,p)=>p[0]*Math.pow(x,p[1]),
    init:(x,y)=>{const q=x.map((v,i)=>[v,y[i]]).filter(r=>r[0]>0&&r[1]>0);if(q.length>2){const l=Mx.lstsq(q.map(r=>[1,Math.log(r[0])]),q.map(r=>Math.log(r[1])));if(l)return[[Math.exp(l.beta[0]),l.beta[1]]]}return[[1,1]]}},
  log:{label:'Logarithmic  a + b·ln(x)',names:['a','b'],f:(x,p)=>p[0]+p[1]*Math.log(x),
    init:(x,y)=>{const q=x.map((v,i)=>[v,y[i]]).filter(r=>r[0]>0);const l=Mx.lstsq(q.map(r=>[1,Math.log(r[0])]),q.map(r=>r[1]));return[l?l.beta:[0,1]]}},
  gauss:{label:'Gaussian  y0 + A·e^(−(x−xc)²/2w²)',names:['y0','A','xc','w'],f:(x,p)=>p[0]+p[1]*Math.exp(-((x-p[2])**2)/(2*p[3]*p[3])),
    init:(x,y)=>{const mn=Math.min(...y),mxv=Math.max(...y),k=y.indexOf(mxv);return[[mn,mxv-mn,x[k],rngx(x)/8],[mn,mxv-mn,x[k],rngx(x)/20]]}},
  lorentz:{label:'Lorentzian  y0 + A·w²/((x−xc)²+w²)',names:['y0','A','xc','w'],f:(x,p)=>p[0]+p[1]*p[3]*p[3]/((x-p[2])**2+p[3]*p[3]),
    init:(x,y)=>{const mn=Math.min(...y),mxv=Math.max(...y),k=y.indexOf(mxv);return[[mn,mxv-mn,x[k],rngx(x)/10],[mn,mxv-mn,x[k],rngx(x)/30]]}},
  boltz:{label:'Boltzmann sigmoid  A2 + (A1−A2)/(1+e^((x−x0)/dx))',names:['A1','A2','x0','dx'],f:(x,p)=>p[1]+(p[0]-p[1])/(1+Math.exp((x-p[2])/p[3])),
    init:(x,y)=>{const r=rngx(x),m=(Math.min(...x)+Math.max(...x))/2,up=y[y.length-1]>y[0];return[[y[0],y[y.length-1],m,(up?-1:1)*r/10],[y[0],y[y.length-1],m,(up?1:-1)*r/10]]}},
  logistic4:{label:'4-parameter logistic  D + (A−D)/(1+(x/C)^B)',names:['A','D','C','B'],f:(x,p)=>p[1]+(p[0]-p[1])/(1+Math.pow(x/p[2],p[3])),
    init:(x,y)=>{const q=x.filter(v=>v>0);const m=Math.sqrt(Math.min(...q)*Math.max(...q))||1;return[[y[0],y[y.length-1],m,1],[y[0],y[y.length-1],m,-1],[y[0],y[y.length-1],m,2]]}},
  hill:{label:'Hill  Vmax·x^n/(k^n+x^n)',names:['Vmax','k','n'],f:(x,p)=>p[0]*Math.pow(x,p[2])/(Math.pow(Math.abs(p[1]),p[2])+Math.pow(x,p[2])),
    init:(x,y)=>[[Math.max(...y),(Math.min(...x)+Math.max(...x))/2||1,1],[Math.max(...y),Math.max(...x)/4||1,2]]},
  mm:{label:'Michaelis–Menten  Vmax·x/(Km+x)',names:['Vmax','Km'],f:(x,p)=>p[0]*x/(p[1]+x),init:(x,y)=>[[Math.max(...y)*1.2,Math.max(...x)/3||1]]},
  langmuir:{label:'Langmuir  Qm·K·x/(1+K·x)',names:['Qm','K'],f:(x,p)=>p[0]*p[1]*x/(1+p[1]*x),init:(x,y)=>[[Math.max(...y)*1.2,1/(Math.max(...x)/3||1)]]},
  sine:{label:'Sine  y0 + A·sin(2π·x/T + φ)',names:['y0','A','T','phi'],f:(x,p)=>p[0]+p[1]*Math.sin(2*Math.PI*x/p[2]+p[3]),
    init:(x,y)=>{const m=Mx.mean(y),a=(Math.max(...y)-Math.min(...y))/2;let cr=0;for(let i=1;i<y.length;i++)if((y[i-1]-m)*(y[i]-m)<0)cr++;const T=cr>0?2*rngx(x)/cr:rngx(x);return[0,Math.PI/2,Math.PI,1.5*Math.PI].map(ph=>[m,a,T,ph])}}
};
A.MODELS=MODELS;
function runFit(f,starts,x,y){let best=null;for(const s of starts){let r;try{r=Mx.lm(f,s,x,y)}catch(e){continue}if(r.p.every(Number.isFinite)&&(!best||r.c<best.c))best=r}return best}
function fitStats(y,fit,k){const n=y.length,yb=Mx.mean(y);let sse=0,sst=0;for(let i=0;i<n;i++){sse+=(y[i]-fit[i])**2;sst+=(y[i]-yb)**2}const r2=1-sse/sst;
  return{n,sse,sst,r2,adj:n>k?1-(1-r2)*(n-1)/(n-k):NaN,rmse:Math.sqrt(sse/Math.max(n-k,1)),dof:n-k}}
function paramTable(names,p,se,dof,alpha=0.05){const tc=dof>0?Mx.tcrit(alpha,dof):NaN;
  return T(['Parameter','Value','Std. Error','t','Prob>|t|',`${100*(1-alpha)}% LCL`,`${100*(1-alpha)}% UCL`],
    names.map((n,i)=>{const t=p[i]/se[i];return[n,F(p[i],8),F(se[i],5),F(t,4),PV(Mx.tp2(t,dof)),F(p[i]-tc*se[i],6),F(p[i]+tc*se[i],6)]}))}
function gofTable(s,extra=[]){return KV([['N',s.n],['Degrees of freedom',s.dof],['Residual sum of squares',F(s.sse)],['Reduced χ²',F(s.sse/Math.max(s.dof,1))],['RMSE',F(s.rmse)],['R²',F(s.r2,6)],['Adj. R²',F(s.adj,6)],['AIC',F(s.n*Math.log(s.sse/s.n)+2*(s.n-s.dof),6)],['BIC',F(s.n*Math.log(s.sse/s.n)+(s.n-s.dof)*Math.log(s.n),6)],...extra])}

// ===================== DESCRIPTIVE / NORMALITY =====================
def('descr','Statistics','Descriptive Statistics',[cols('cols','Columns','y'),ALPHA],({cols:cs,alpha},ctx)=>{
  const st=cs.map(ci=>{const v=Mx.clean(ctx.vals(ci)),s=Mx.sorted(v),n=v.length,m=Mx.mean(v),sd=Mx.sd(v),sem=sd/Math.sqrt(n),tc=n>1?Mx.tcrit(alpha,n-1):NaN;
    return[n,Mx.sum(v),m,sd,sem,m-tc*sem,m+tc*sem,Mx.variance(v),sd/m*100,Mx.skew(v),Mx.kurt(v),s[0],Mx.quantile(s,.25),Mx.quantile(s,.5),Mx.quantile(s,.75),s[n-1],s[n-1]-s[0]]});
  const L=['N','Sum','Mean','Standard Deviation','SE of Mean',`Mean ${100*(1-alpha)}% LCL`,`Mean ${100*(1-alpha)}% UCL`,'Variance','CV (%)','Skewness','Kurtosis (excess)','Minimum','Q1','Median','Q3','Maximum','Range'];
  return{html:T(['Statistic',...cs.map(c=>ctx.name(c))],L.map((l,i)=>[l,...st.map(r=>i===0?r[0]:F(r[i]))]))}});
def('normal','Statistics','Normality Test & Q-Q Plot',[col('y','Data column','y'),ALPHA],({y,alpha},ctx)=>{
  const raw=ctx.vals(y),rows=[],v=[];raw.forEach((a,i)=>{if(Number.isFinite(a)){rows.push(i);v.push(a)}});
  const n=v.length;if(n<8)return warn('Need at least 8 values.');
  const m=Mx.mean(v),sd=Math.sqrt(v.reduce((s,a)=>s+(a-m)**2,0)/n);
  const sk=v.reduce((s,a)=>s+((a-m)/sd)**3,0)/n,ku=v.reduce((s,a)=>s+((a-m)/sd)**4,0)/n-3,jb=n/6*(sk*sk+ku*ku/4),p=Mx.chi2sf(jb,2);
  const sv=Mx.sorted(v),sd1=Mx.sd(v);let a2=-n;for(let i=0;i<n;i++){const z1=Mx.normcdf((sv[i]-m)/sd1),z2=Mx.normcdf((sv[n-1-i]-m)/sd1);a2-=(2*i+1)/n*(Math.log(Math.max(z1,1e-300))+Math.log(Math.max(1-z2,1e-300)))}
  const as=a2*(1+.75/n+2.25/(n*n)),adp=as>=.6?Math.exp(1.2937-5.709*as+.0186*as*as):as>=.34?Math.exp(.9177-4.279*as-1.38*as*as):as>=.2?1-Math.exp(-8.318+42.796*as-59.938*as*as):1-Math.exp(-13.436+101.14*as-223.73*as*as);
  const order=v.map((_,i)=>i).sort((a,b)=>v[a]-v[b]),th=new Array(n),sm=new Array(n);
  order.forEach((idx,r)=>{th[r]=Mx.norminv((r+1-.375)/(n+.25));sm[r]=v[idx]});
  const l=Mx.lstsq(th.map(t=>[1,t]),sm),corr=Math.sqrt(Math.max(0,1-l.sse/sm.reduce((s,a)=>s+(a-Mx.mean(sm))**2,0)));
  return{html:KV([['N',n],['Skewness',F(sk)],['Excess kurtosis',F(ku)],['Jarque–Bera statistic',F(jb)],['Prob > χ²(2)',PV(p)],['Anderson–Darling A²*',F(as)],['Anderson–Darling p',PV(adp)],['Q-Q correlation',F(corr,5)],
    ['Decision',Math.min(p,adp)>alpha?`Cannot reject normality at α=${alpha}`:`Reject normality at α=${alpha}`]])+'<p class="note">Q-Q plot data added to sheet: plot Sample Quantile vs Theoretical Quantile as scatter.</p>',
    cols:[{name:'Theoretical Quantile',d:th},{name:'Sample Quantile',d:sm}],plot:{type:'scatter',series:[[0,1,'Q-Q']],xl:'Theoretical quantile',yl:'Sample quantile'}}});

// ===================== HYPOTHESIS TESTS =====================
def('ttest1','Statistics','One-Sample t-Test',[col('y','Data column','y'),num('mu','Test mean μ₀',0),ALPHA],({y,mu,alpha},ctx)=>{
  const v=Mx.clean(ctx.vals(y)),n=v.length,m=Mx.mean(v),se=Mx.sd(v)/Math.sqrt(n),t=(m-mu)/se,df=n-1,tc=Mx.tcrit(alpha,df);
  return{html:KV([['N',n],['Mean',F(m)],['SD',F(Mx.sd(v))],['SE',F(se)],['H₀ mean',F(mu)],['t',F(t)],['df',df],['Prob>|t|',PV(Mx.tp2(t,df))],[`${100*(1-alpha)}% CI of mean`,`${F(m-tc*se)} … ${F(m+tc*se)}`],['Conclusion',Mx.tp2(t,df)<alpha?'Mean differs from μ₀':'No significant difference']])}});
def('ttest2','Statistics','Two-Sample t-Test',[col('a','Sample 1','y'),col('b','Sample 2','y'),sel('eq','Variance assumption',[['welch','Unequal (Welch)'],['pooled','Equal (pooled)']],'welch'),ALPHA],({a,b,eq,alpha},ctx)=>{
  const u=Mx.clean(ctx.vals(a)),w=Mx.clean(ctx.vals(b)),n1=u.length,n2=w.length,m1=Mx.mean(u),m2=Mx.mean(w),v1=Mx.variance(u),v2=Mx.variance(w);
  let se,df;if(eq==='pooled'){df=n1+n2-2;const sp=((n1-1)*v1+(n2-1)*v2)/df;se=Math.sqrt(sp*(1/n1+1/n2))}else{se=Math.sqrt(v1/n1+v2/n2);df=se**4/((v1/n1)**2/(n1-1)+(v2/n2)**2/(n2-1))}
  const d=m1-m2,t=d/se,p=Mx.tp2(t,df),tc=Mx.tcrit(alpha,df),Fv=Math.max(v1,v2)/Math.min(v1,v2),pF=Math.min(1,2*Mx.fsf(Fv,(v1>=v2?n1:n2)-1,(v1>=v2?n2:n1)-1));
  return{html:T(['','Sample 1','Sample 2'],[['Column',ctx.name(a),ctx.name(b)],['N',n1,n2],['Mean',F(m1),F(m2)],['SD',F(Math.sqrt(v1)),F(Math.sqrt(v2))],['SE',F(Math.sqrt(v1/n1)),F(Math.sqrt(v2/n2))]])+
    KV([['Difference of means',F(d)],['t',F(t)],['df',F(df,5)],['Prob>|t|',PV(p)],[`${100*(1-alpha)}% CI of difference`,`${F(d-tc*se)} … ${F(d+tc*se)}`],['F-test of variances (F, p)',`${F(Fv)}, ${PV(pF)}`],['Conclusion',p<alpha?'Means differ significantly':'No significant difference']])}});
def('ttestp','Statistics','Paired t-Test',[col('a','Sample 1','y'),col('b','Sample 2','y'),ALPHA],({a,b,alpha},ctx)=>{
  const A1=ctx.vals(a),B1=ctx.vals(b),d=[];for(let i=0;i<Math.min(A1.length,B1.length);i++)if(Number.isFinite(A1[i])&&Number.isFinite(B1[i]))d.push(A1[i]-B1[i]);
  const n=d.length,m=Mx.mean(d),se=Mx.sd(d)/Math.sqrt(n),t=m/se,df=n-1,tc=Mx.tcrit(alpha,df);
  return{html:KV([['Pairs',n],['Mean difference',F(m)],['SD of differences',F(Mx.sd(d))],['SE',F(se)],['t',F(t)],['df',df],['Prob>|t|',PV(Mx.tp2(t,df))],[`${100*(1-alpha)}% CI`,`${F(m-tc*se)} … ${F(m+tc*se)}`]])}});
def('anova1','Statistics','One-Way ANOVA',[cols('cols','Group columns (each column = group)','y'),ALPHA],({cols:cs,alpha},ctx)=>{
  const g=cs.map(c=>Mx.clean(ctx.vals(c))),k=g.length,N=g.reduce((s,a)=>s+a.length,0),gm=Mx.sum(g.map(Mx.sum))/N;
  if(k<2)return warn('Select at least two columns.');
  const ssb=g.reduce((s,a)=>s+a.length*(Mx.mean(a)-gm)**2,0),ssw=g.reduce((s,a)=>{const m=Mx.mean(a);return s+a.reduce((q,v)=>q+(v-m)**2,0)},0),dfb=k-1,dfw=N-k,msb=ssb/dfb,msw=ssw/dfw,Fv=msb/msw,p=Mx.fsf(Fv,dfb,dfw);
  const pw=[];for(let i=0;i<k;i++)for(let j=i+1;j<k;j++){const d=Mx.mean(g[i])-Mx.mean(g[j]),se=Math.sqrt(msw*(1/g[i].length+1/g[j].length)),t=d/se,pr=Math.min(1,Mx.tp2(t,dfw)*k*(k-1)/2);pw.push([`${ctx.name(cs[i])} − ${ctx.name(cs[j])}`,F(d),F(se),F(t),PV(pr),pr<alpha?'Yes':'No'])}
  const tk=[];for(let i=0;i<k;i++)for(let j=i+1;j<k;j++){const d=Mx.mean(g[i])-Mx.mean(g[j]),q=Math.abs(d)/Math.sqrt(msw/2*(1/g[i].length+1/g[j].length)),pt=1-Mx.ptukey(q,k,dfw);tk.push([`${ctx.name(cs[i])} − ${ctx.name(cs[j])}`,F(d),F(q),PV(pt),pt<alpha?'Yes':'No'])}
  return{html:H('ANOVA table')+T(['Source','SS','df','MS','F','Prob>F'],[['Between groups',F(ssb),dfb,F(msb),F(Fv),PV(p)],['Within groups',F(ssw),dfw,F(msw),'',''],['Total',F(ssb+ssw),N-1,'','','']])+
    H('Group means')+T(['Group','N','Mean','SD','SE'],g.map((a,i)=>[ctx.name(cs[i]),a.length,F(Mx.mean(a)),F(Mx.sd(a)),F(Mx.sd(a)/Math.sqrt(a.length))]))+
    H('Tukey HSD post-hoc')+T(['Comparison','Mean diff','q','Adj. p','Significant'],tk)+H('Bonferroni post-hoc')+T(['Comparison','Mean diff','SE','t','Adj. p','Significant'],pw)+`<p class="note">${p<alpha?'At least one group mean differs.':'No evidence group means differ.'}</p>`}});
def('mwu','Statistics','Mann–Whitney U Test',[col('a','Sample 1','y'),col('b','Sample 2','y'),ALPHA],({a,b,alpha},ctx)=>{
  const u=Mx.clean(ctx.vals(a)),w=Mx.clean(ctx.vals(b)),n1=u.length,n2=w.length,N=n1+n2,{r,tie}=Mx.rank([...u,...w]);

    let r=i,rm=y[i];while(r<n-1&&y[r+1]<=y[i]){r++;rm=Math.min(rm,y[r])}

    const cat=add(''),pagesObj=add(''),fontIds={};
    this.fonts.forEach((f,k)=>{fontIds[f.name]=add(`<< /Type /Font /Subtype /Type1 /BaseFont /${f.base}${f.base==='Symbol'?'':' /Encoding /WinAnsiEncoding'} >>`)});

<script>'use strict';
// Sample datasets for trying out the app.
const SAMPLES=(()=>{
  let seed=20260;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const nrm=(m=0,s=1)=>m+s*Math.sqrt(-2*Math.log(rnd()+1e-12))*Math.cos(2*Math.PI*rnd());
  const lin=(a,b,n)=>Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1));
  const g=(x,A,c,w)=>A*Math.exp(-((x-c)**2)/(2*w*w));
  const r4=v=>+v.toFixed(4);
  return{
    spectrum:{label:'Raman spectrum (3 peaks + baseline)',make:()=>{const x=lin(100,300,401);return{name:'Spectrum',cols:[{name:'Raman Shift',unit:'cm⁻¹',des:'X',d:x},{name:'Intensity',unit:'a.u.',des:'Y',d:x.map(v=>r4(5+.05*(v-100)+g(v,40,150,6)+g(v,100,190,5)+g(v,60,240,8)+nrm(0,1.2)))}]}}},
    kinetics:{label:'Decay kinetics with error bars',make:()=>{const t=lin(0,30,31);return{name:'Kinetics',cols:[{name:'Time',unit:'min',des:'X',d:t},{name:'Concentration',unit:'mM',des:'Y',d:t.map(v=>r4(2+8*Math.exp(-v/6)+nrm(0,.18)))},{name:'Error',unit:'mM',des:'E',d:t.map(()=>r4(.15+rnd()*.15))}]}}},
    dose:{label:'Dose–response curve',make:()=>{const x=Array.from({length:13},(_,i)=>+Math.pow(10,-3+i*.5).toPrecision(4));return{name:'DoseResponse',cols:[{name:'Concentration',unit:'µM',des:'X',d:x},{name:'Response',unit:'%',des:'Y',d:x.map(v=>r4(4+96/(1+Math.pow(1.5/v,1.2))+nrm(0,2.5)))},{name:'SD',unit:'%',des:'E',d:x.map(()=>r4(2+rnd()*3))}]}}},
    groups:{label:'Four treatment groups (ANOVA / box plot)',make:()=>({name:'Groups',cols:[['Control',10,2],['Drug A',12,2.2],['Drug B',14,2],['Drug C',10.5,3]].map(([n,m,s])=>({name:n,unit:'mg/L',des:'Y',d:Array.from({length:20},()=>r4(nrm(m,s)))}))})},
    regression:{label:'Multiple regression (X1, X2, X3 → Y)',make:()=>{const n=40,x1=Array.from({length:n},()=>r4(rnd()*10)),x2=Array.from({length:n},()=>r4(rnd()*5)),x3=Array.from({length:n},()=>r4(rnd()*20));

    xyz:{label:'Scattered XYZ points (grid to matrix)',make:()=>{const n=180,x=Array.from({length:n},()=>r4(rnd()*6-3)),y=Array.from({length:n},()=>r4(rnd()*6-3));return{name:'XYZ',cols:[{name:'X',des:'X',d:x},{name:'Y',des:'Y',d:y},{name:'Z',des:'Z',d:x.map((v,i)=>r4(Math.sin(v)*Math.cos(y[i])+nrm(0,.03)))}]}}},
    surface:{label:'Matrix: sin(r)/r surface (heatmap, contour, 3D)',make:()=>{const xv=lin(-9,9,45).map(r4),yv=xv.slice();return{name:'Surface',isMatrix:true,xv,yv,cols:xv.map((x,j)=>({name:String(x),des:'Y',d:yv.map(y=>{const r=Math.hypot(x,y);return r4(r<1e-9?1:Math.sin(r)/r)})}))}}},
    polar:{label:'Polar curves (cardioid, rose)',make:()=>{const t=Array.from({length:73},(_,i)=>i*5);return{name:'Polar',cols:[{name:'Angle',unit:'deg',des:'X',d:t},{name:'Cardioid',des:'Y',d:t.map(a=>r4(1+Math.cos(a*Math.PI/180)))},{name:'Rose',des:'Y',d:t.map(a=>r4(Math.abs(2*Math.sin(2*a*Math.PI/180))))}]}}},
    templog:{label:'Temperature log with timestamps (date axis)',make:()=>{const t0=Date.UTC(2024,2,1,0,0),n=96,t=Array.from({length:n},(_,i)=>t0+i*36e5);return{name:'TempLog',cols:[{name:'Time',des:'X',fmt:'date',d:t},{name:'Temperature',unit:'°C',des:'Y',d:t.map((v,i)=>r4(15+6*Math.sin(2*Math.PI*(i-9)/24)+i*.03+nrm(0,.4)))},{name:'Humidity',unit:'%',des:'Y',d:t.map((v,i)=>r4(60-12*Math.sin(2*Math.PI*(i-9)/24)+nrm(0,1.5)))}]}}},
    calib:{label:'Calibration standards + unknown samples',make:()=>{const x=[0.5,1,2,5,10,20,50,100],y=x.map(v=>r4(0.02+0.085*v+nrm(0,0.15)));return{name:'Calibration',cols:[{name:'Concentration',unit:'µg/mL',des:'X',d:x},{name:'Absorbance',des:'Y',d:y},{name:'Unknown',des:'Y',d:[0.35,2.4,5.1,0.9,7.7,12]}]}}},

function dialog({title,fields,ok='OK',vals={},hint,sheet,onOk}){
  const sh=sheet||curSheet(),dlg=document.createElement('dialog');dlg.className='dlg';

  const fh=fields.map(f=>{const v=vals[f.k]??f.def;const id='f_'+f.k;
    switch(f.t){case'col':return`<div class="f"><label for="${id}">${f.label}</label><select id="${id}">${colOpts(f,v)}</select></div>`;
      case'cols':return`<div class="f"><label for="${id}">${f.label} <span class="note">(Ctrl/Shift-click for several)</span></label><select id="${id}" multiple>${colOpts(f,v)}</select></div>`;

      case'sel':return`<div class="f"><label for="${id}">${f.label}</label><select id="${id}">${(typeof f.opts==='function'?f.opts():f.opts).map(([k,l])=>`<option value="${esc(k)}" ${String(v)===String(k)?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;
      case'chk':return`<div class="f c"><input id="${id}" type="checkbox" ${v?'checked':''}><label for="${id}">${f.label}</label></div>`;
      case'msel':return`<div class="f"><label for="${id}">${f.label}</label><select id="${id}" multiple>${f.opts.map(([k,l])=>`<option value="${esc(k)}" ${(v||[]).map(String).includes(String(k))?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;
      case'area':return`<div class="f"><label for="${id}">${f.label}</label><textarea id="${id}" rows="${f.rows||10}" spellcheck="false" style="font:12px ui-monospace,Menlo,monospace;width:100%">${esc(v??'')}</textarea></div>`;
      case'txt':return`<div class="f"><label for="${id}">${f.label}</label><input id="${id}" type="text" value="${esc(v??'')}" spellcheck="false"></div>`}}).join('');

  const first=$('select,input,textarea',dlg);first&&first.focus()}

  let yc=multi?notX:[...notX,...allY.filter(i=>!notX.includes(i))];if(!yc.length)yc=sh.cols.map((_,i)=>i);const ycAll=multi?notX:(allY.length?allY:yc);
  const xc=sel.find(isX)??sh.cols.findIndex((c,i)=>isX(i)),xcols=sh.cols.map((_,i)=>i).filter(isX),v={};let yi=0;

  p.innerHTML=`<div class="gh"><b>Gadgets</b><select id="gSer">${ss.map((s,i)=>`<option value="${i}" ${i===GS.si?'selected':''}>${esc((sheetById(g.sheetId).cols[s.y]||{}).name||'Y')}</option>`).join('')}</select><span class="sp"></span><button data-gact="close">✕</button></div>
  <div class="gt">${GTABS.map(([k,l])=>`<button data-gtab="${k}" class="${k===GS.tab?'on':''}">${l}</button>`).join('')}</div><div class="gb" id="gBody"></div>`;
  gadgetBody(g)}
function gHTML(h){$('#gBody').innerHTML=h}
function gRoiNote(g){return g.roi?`<div class="note">Region: ${Mx.fmt(toDays(g,g.roi.x0),6)} … ${Mx.fmt(toDays(g,g.roi.x1),6)} ${g.xdate?'(days)':''}</div>`:'<div class="note">No region set – whole curve is used. Use the <b>ROI</b> tool and drag across the graph.</div>'}
const sendBtn=(id)=>`<button class="p" data-gact="send" data-id="${id}">Send to Results</button>`;
function gadgetBody(g){
  chart.tmp={gid:g.id};const T=chart.tmp,c=gCtx(),tab=GS.tab;if(!c){gHTML('<span class="note">No data.</span>');return}
  switch(tab){
    case'region':{const r=g.roi;gHTML(`<div class="r2"><label>From X</label><input type="number" step="any" data-roi="x0" value="${r?r.x0:''}"><label>To X</label><input type="number" step="any" data-roi="x1" value="${r?r.x1:''}"></div><div class="row"><button data-gact="roiOn">Draw region…</button><button data-gact="roiClr">Clear region</button><button data-gact="roiMask">Mask outside region</button></div>${gRoiNote(g)}<div class="note">Every gadget and every analysis dialog (“Limit X range”) can use this region. Drag a rectangle with the ROI tool; reset by clearing.</div>`);break}
    case'stats':{const r=gRun('descr',{cols:[c.yi]});T.hlines=[];const v=Mx.clean(c.ctx.vals(c.yi));if(v.length>1){const m=Mx.mean(v),sd=Mx.sd(v);T.hlines=[{y:m,label:'mean',color:'#d97706'},{y:m+sd,dash:1,color:'#d97706'},{y:m-sd,dash:1,color:'#d97706'}]}chart.render();gHTML(gRoiNote(g)+r.res.html+sendBtn('descr'));break}
    case'integ':{const r=gRun('integ',{});const p=gPoints(c);T.fills=[{x:p.x,y:p.y,color:'#16a34a'}];chart.render();gHTML(gRoiNote(g)+r.res.html+sendBtn('integ'));break}
    case'fit':{const models=[['poly1','Linear'],['poly2','Polynomial 2'],['poly3','Polynomial 3'],...['exp','expdec1','expgrow','power','log','gauss','lorentz','boltz','logistic4','hill','mm','sine'].map(k=>[k,MODELS[k].label.split('  ')[0]])];let r;
      if(GS.model.startsWith('poly')){const o=+GS.model.slice(4);r=o===1?gRun('linreg',{band:false,pband:false,resid:false}):gRun('polyreg',{order:o,resid:false})}else r=gRun('nlfit',{model:GS.model,expr:'',init:'',fix:'',bounds:'',resid:false});
      if(r.res.curves)T.curves=r.res.curves.filter(cu=>!cu.dash).map(cu=>({x:g.xdate?cu.x.map(v=>v*864e5):cu.x,y:cu.y,color:'#dc2626'}));chart.render();
      gHTML(`<div class="row"><label>Function</label><select id="gModel">${models.map(([k,l])=>`<option value="${k}" ${k===GS.model?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`+gRoiNote(g)+r.res.html+sendBtn(GS.model==='poly1'?'linreg':GS.model.startsWith('poly')?'polyreg':'nlfit'));break}
    case'peaks':{const r=gRun('peakfind',{thr:GS.thr,smooth:0,dist:0});if(r.res.marks)T.marks=r.res.marks.map(m=>({...m,x:g.xdate?m.x*864e5:m.x}));chart.render();gHTML(`<div class="row"><label>Min prominence %</label><input id="gThr" type="number" value="${GS.thr}" min="0.5" step="1" style="width:70px"></div>`+gRoiNote(g)+r.res.html+sendBtn('peakfind'));break}
    case'deriv':{const r=gRun('deriv',{ord:'1',w:0});gHTML(gRoiNote(g)+'<canvas id="gMini" class="mini"></canvas><div class="note">First derivative of the selected range.</div>'+sendBtn('deriv'));const col=r.res.cols&&r.res.cols[0],x=[],y=[];if(col){const xc=c.clone.cols[c.xi].d;col.d.forEach((v,i)=>{if(Number.isFinite(v)){x.push(xc[i]);y.push(v)}})}miniPlot($('#gMini'),x,y);break}
    case'fft':{const r=gRun('fft',{win:'hann',detrend:true});gHTML(gRoiNote(g)+'<canvas id="gMini" class="mini"></canvas>'+r.res.html+sendBtn('fft'));if(r.res.cols)miniPlot($('#gMini'),r.res.cols[0].d,r.res.cols[1].d);break}
    case'interp':{const r=gRun('interp',{m:'spline',n:300});if(r.res.cols)T.curves=[{x:r.res.cols[0].d,y:r.res.cols[1].d,color:'#7c3aed'}];if(g.xdate&&T.curves)T.curves[0].x=T.curves[0].x.map(v=>v*864e5);chart.render();gHTML(gRoiNote(g)+r.res.html+sendBtn('interp'));break}
    case'intersect':{const ss=gSeries(g);if(ss.length<2){gHTML('<span class="note">Needs a graph with two or more curves.</span>');break}const a=chart.sdata(ss[0]),b=chart.sdata(ss[1]),lo=g.roi?g.roi.x0:-Infinity,hi=g.roi?g.roi.x1:Infinity;
      const sa=a.x.map((x,i)=>[x,a.y[i]]).sort((p,q)=>p[0]-q[0]),sb=b.x.map((x,i)=>[x,b.y[i]]).sort((p,q)=>p[0]-q[0]);const fb=Mx.linterp(sb.map(p=>p[0]),sb.map(p=>p[1])),pts=[];
      for(let i=1;i<sa.length;i++){const[x0,y0]=sa[i-1],[x1,y1]=sa[i];if(x1<sb[0][0]||x0>sb[sb.length-1][0])continue;const d0=y0-fb(x0),d1=y1-fb(x1);if(d0===0||d0*d1<0){const t=d0===d1?0:d0/(d0-d1),x=x0+(x1-x0)*t,y=y0+(y1-y0)*t;if(x>=lo&&x<=hi)pts.push([x,y])}}
      T.marks=pts.map((p,i)=>({x:p[0],y:p[1],label:String(i+1),sym:'circle'}));chart.render();gHTML(`<div class="note">Curves: ${esc(a.name)} × ${esc(b.name)}</div>`+gRoiNote(g)+(pts.length?T_html(['#','X','Y'],pts.map((p,i)=>[i+1,g.xdate?formatDate(p[0]):Mx.fmt(p[0],6),Mx.fmt(p[1],6)])):'<p class="note">No intersections found.</p>'));break}
    case'rise':{const p=gPoints(c);if(p.x.length<6){gHTML('<span class="note">Need at least 6 points.</span>');break}const k=Math.max(2,Math.floor(p.x.length*.1)),lo=Mx.mean(p.y.slice(0,k)),hi=Mx.mean(p.y.slice(-k)),amp=hi-lo;if(!amp){gHTML('<span class="note">Flat signal.</span>');break}
      const cross=(lv)=>{for(let i=1;i<p.x.length;i++){const a=(p.y[i-1]-lv)*(amp>0?1:-1),b=(p.y[i]-lv)*(amp>0?1:-1);if(a<0&&b>=0)return p.x[i-1]+(p.x[i]-p.x[i-1])*(lv-p.y[i-1])/(p.y[i]-p.y[i-1])}return NaN};
      const l10=lo+.1*amp,l50=lo+.5*amp,l90=lo+.9*amp,t10=cross(l10),t50=cross(l50),t90=cross(l90);T.marks=[[t10,l10,'10%'],[t50,l50,'50%'],[t90,l90,'90%']].filter(m=>Number.isFinite(m[0])).map(m=>({x:m[0],y:m[1],label:m[2],sym:'circle'}));T.hlines=[{y:lo,label:'base',dash:1,color:'#888'},{y:hi,label:'top',dash:1,color:'#888'}];chart.render();
      gHTML(gRoiNote(g)+T_html(['Quantity','Value'],[['Base level',Mx.fmt(lo)],['Top level',Mx.fmt(hi)],['Amplitude',Mx.fmt(amp)],['t10%',Mx.fmt(t10)],['t50%',Mx.fmt(t50)],['t90%',Mx.fmt(t90)],['Rise time (10–90 %)',Mx.fmt(t90-t10)]]));break}
    case'cursor':{const cs=g.cursors||[];let h='<div class="note">Use the <b>Cursor</b> tool: click near a data point (twice for two cursors).</div>';
      if(cs.length)h+=T_html(['Cursor','X','Y'],cs.map((q,i)=>['C'+(i+1),g.xdate?formatDate(q.x):Mx.fmt(q.x,7),Mx.fmt(q.y,7)]));
      if(cs.length===2){const dx=cs[1].x-cs[0].x,dy=cs[1].y-cs[0].y;h+=T_html(['Δ','Value'],[['ΔX',g.xdate?Mx.fmt(dx/864e5,6)+' days':Mx.fmt(dx,7)],['ΔY',Mx.fmt(dy,7)],['Slope ΔY/ΔX',Mx.fmt(dy/dx,6)],['Distance',Mx.fmt(Math.hypot(dx,dy),6)]])}
      h+='<div class="row"><button data-gact="curClr">Clear cursors</button></div>';gHTML(h);break}
    case'sel':{const sel=g.sel||[];let h=`<div class="note">Use the <b>Brush</b> tool and drag a rectangle over points.</div><p><b>${sel.length}</b> point(s) selected.</p>`;
      if(sel.length){const sh=c.sh,ys=sel.map(s=>sh.cols[s.y].d[s.row]).filter(Number.isFinite);if(ys.length)h+=T_html(['Y of selection','Value'],[['Mean',Mx.fmt(Mx.mean(ys))],['SD',Mx.fmt(Mx.sd(ys))],['Min',Mx.fmt(Math.min(...ys))],['Max',Mx.fmt(Math.max(...ys))]])}
      h+='<div class="row"><button data-gact="selMask">Mask</button><button data-gact="selSubset">New sheet from rows</button><button data-gact="selDel">Delete Y values</button><button data-gact="selCopy">Copy</button><button data-gact="selClr">Clear</button></div>';gHTML(h);break}
    case'slice':{const sh=c.sh,sl=g.slice||{col:Math.max(0,sh.cols.findIndex(q=>q.des==='X')),levels:null},col=sl.col??0,vals=[...new Set(sh.cols[col].d.map(v=>String(v)))].filter(v=>v!=='NaN').slice(0,60),sel=sl.levels||vals;
      gHTML(`<div class="row"><label>Slice by column</label><select id="gSliceCol">${sh.cols.map((q,i)=>`<option value="${i}" ${i===col?'selected':''}>${esc(L(i)+': '+(q.name||''))}</option>`).join('')}</select></div><div class="note">Click values to include / exclude them from the plot (non-destructive).</div><div>${vals.map(v=>`<span class="tag chipv ${sel.includes(v)?'on':''}" data-gact="sliceTog" data-v="${esc(v)}">${esc(v.length>14?v.slice(0,13)+'…':v)}</span>`).join('')}</div><div class="row"><button data-gact="sliceAll">All</button><button data-gact="sliceClr">Clear slicer</button></div>`);
      $('#gSliceCol').onchange=e=>{g.slice={col:+e.target.value,levels:null};chart.render();gadgetRefresh()};break}
    case'translate':gHTML(`<div class="r2"><label>ΔX</label><input id="gDx" type="number" step="any" value="0"><label>ΔY</label><input id="gDy" type="number" step="any" value="0"></div><div class="row"><button class="p" data-gact="translate">Apply to data</button></div><div class="note">Adds the offsets to the curve's X and Y columns (undoable).</div>`);break}
}
function T_html(head,rows){return`<table class="rt"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function gadgetAction(a,el){const g=curGraph();if(!g)return;const c=gCtx();
  switch(a){
    case'close':gadgetToggle(false);break;
    case'roiOn':setGraphMode('roi');break;
    case'roiClr':g.roi=null;chart.render();gadgetRefresh();break;
    case'roiMask':{if(!g.roi)return flash('Draw a region first');snap();const sh=c.sh,n=NR(sh),xc=c.clone.cols[c.xi].d;sh.mask=sh.mask||[];for(let i=0;i<n;i++)if(!(xc[i]>=g.roi.x0&&xc[i]<=g.roi.x1))sh.mask[i]=true;dirty();redrawGraph();flash('Rows outside the region are masked (Column ▸ Clear mask to undo)');break}
    case'send':{const id=el.dataset.id,r=gRun(id,{});if(!r)return;const args={...r.args};if(g.roi){args._xlo=toDays(g,g.roi.x0);args._xhi=toDays(g,g.roi.x1)}
      // map synthetic index column back: only real columns can be sent
      if(c.s.x==null||c.s.x<0){flash('Set an X column for this series to send results to the worksheet');return}runAnalysis(id,args,c.sh);break}
    case'sliceTog':{const sh=c.sh,sl=g.slice||{col:Math.max(0,sh.cols.findIndex(q=>q.des==='X')),levels:null},vals=[...new Set(sh.cols[sl.col].d.map(v=>String(v)))].filter(v=>v!=='NaN');let lv=sl.levels||vals.slice(),v=el.dataset.v;lv=lv.includes(v)?lv.filter(x=>x!==v):[...lv,v];g.slice={col:sl.col,levels:lv};chart.render();gadgetRefresh();break}

    case'selClr':g.sel=[];chart.render();gadgetRefresh();break;
    case'selMask':{snap();const sh=c.sh;sh.mask=sh.mask||[];(g.sel||[]).forEach(s=>sh.mask[s.row]=true);g.sel=[];dirty();redrawGraph();gadgetRefresh();dataChanged(sh.id);break}
    case'selDel':{if(!confirm('Clear the Y value of each selected point?'))return;snap();const sh=c.sh;(g.sel||[]).forEach(s=>{sh.cols[s.y].d[s.row]=NaN});g.sel=[];dirty();redrawGraph();gadgetRefresh();dataChanged(sh.id);break}
    case'selSubset':{const rows=[...new Set((g.sel||[]).map(s=>s.row))].sort((x,y)=>x-y);if(!rows.length)return;snap();const sh=c.sh,ns=mkSheet(sh.name+'_subset',sh.cols.map(col=>({name:col.name,unit:col.unit,comment:col.comment,des:col.des,fmt:col.fmt,d:rows.map(r=>col.d[r]??NaN)})));openWin('sheet',ns.id);break}
    case'selCopy':{const sh=c.sh,rows=[...new Set((g.sel||[]).map(s=>s.row))].sort((x,y)=>x-y);navigator.clipboard.writeText(rows.map(r=>sh.cols.map(col=>col.d[r]??'').join('\t')).join('\n')).then(()=>flash('Copied '+rows.length+' rows')).catch(()=>alert('Clipboard not available'));break}

      if(dy)sh.cols[s.y].d=sh.cols[s.y].d.map(v=>typeof v==='number'?v+dy:v);if(dx&&s.x!=null&&s.x>=0)sh.cols[s.x].d=sh.cols[s.x].d.map(v=>typeof v==='number'?v+(g.xdate?dx*864e5:dx):v);dirty();redrawGraph();dataChanged(sh.id);flash('Curve translated');break}
  }}
function setGraphMode(m){$$('#gtools [data-mode]').forEach(x=>x.classList.toggle('on',x.dataset.mode===m));chart.mode=m;gmode=m;$('#cv').style.cursor=m==='pan'?'grab':'crosshair'}

<script>'use strict';
// Function plots, user-defined fitting functions, curve simulation.
const swapVars=(expr,map)=>expr.replace(/\b([A-Za-z_]\w*)\b(?!\s*\()/g,m=>map[m]??m);
const lin12=(a,b,n)=>Array.from({length:n},(_,i)=>+(a+(b-a)*i/(n-1)).toPrecision(12));

function registerUserFuncs(){
  Object.keys(MODELS).filter(k=>k.startsWith('u:')).forEach(k=>delete MODELS[k]);
  (P.userFuncs||[]).forEach(u=>{try{const names=Mx.exprParams(u.expr),fn=Mx.compile(u.expr,['x',...names]),ini=u.init||{};
    MODELS['u:'+u.name]={label:`${u.name}  y = ${u.expr}`,names,f:(x,p)=>fn(x,...p),init:()=>[names.map(n=>ini[n]!==undefined?+ini[n]:1)],user:true}}catch(e){console.warn('bad user function',u.name,e)}})}

function functionPlotDialog(){
  dialog({title:'Function Plot',sheet:{cols:[]},ok:'Plot',hint:'2D: <code>sin(x)/x</code> · parametric uses <code>t</code> (e.g. x = <code>cos(3*t)</code>, y = <code>sin(2*t)</code>) · 3D uses <code>x</code> and <code>y</code> (e.g. <code>sin(sqrt(x^2+y^2))</code>). The y column is a live formula column: edit the X column and it updates.',
    fields:[{t:'sel',k:'kind',label:'Type',def:'y',opts:[['y','2D function  y = f(x)'],['param','2D parametric  x(t), y(t)'],['z','3D surface  z = f(x, y)']]},
      {t:'txt',k:'f1',label:'f(x)  /  x(t)  /  z(x, y)',def:'sin(x)/x'},{t:'txt',k:'f2',label:'y(t)  (parametric only)',def:'sin(2*t)'},
      {t:'num',k:'a',label:'From',def:-10},{t:'num',k:'b',label:'To',def:10},{t:'num',k:'n',label:'Points',def:400},
      {t:'num',k:'c',label:'y from (3D)',def:-10},{t:'num',k:'d',label:'y to (3D)',def:10},{t:'num',k:'m',label:'Grid size per axis (3D)',def:50}],
    onOk:a=>{try{
      snap();const n=Math.max(2,Math.round(a.n));let sh;
      if(a.kind==='y'){const fn=Mx.compile(a.f1,['x']);fn(1);const xs=lin12(a.a,a.b,n);sh=mkSheet('Function',[{name:'x',des:'X',d:xs},{name:'y',des:'Y',d:xs.map(x=>{const v=fn(x);return Number.isFinite(v)?v:NaN})}]);sh.cols[1].formula=swapVars(a.f1,{x:'A'});openWin('sheet',sh.id);gsel={c0:1,r0:0,c1:1,r1:0,extra:new Set()};plotCmd('line').title=a.f1}
      else if(a.kind==='param'){const fx=Mx.compile(a.f1,['t']),fy=Mx.compile(a.f2,['t']);fx(1);fy(1);const ts=lin12(a.a,a.b,n);sh=mkSheet('Parametric',[{name:'t',des:'X',d:ts},{name:'x(t)',des:'X',d:ts.map(fx)},{name:'y(t)',des:'Y',d:ts.map(fy)}]);sh.cols[1].formula=swapVars(a.f1,{t:'A'});sh.cols[2].formula=swapVars(a.f2,{t:'A'});openWin('sheet',sh.id);gsel={c0:2,r0:0,c1:2,r1:0,extra:new Set()};const g=plotCmd('line');g.series[0].x=1;g.xl='x(t)';g.yl='y(t)';g.title=`x=${a.f1}, y=${a.f2}`;redrawGraph(true)}
      else{const fn=Mx.compile(a.f1,['x','y']);fn(1,1);const m=Math.max(3,Math.round(a.m)),xv=lin12(a.a,a.b,m),yv=lin12(a.c,a.d,m);sh=mkSheet('Surface fn',xv.map((x,j)=>({name:String(x),des:'Y',d:yv.map(y=>{const v=fn(x,y);return Number.isFinite(v)?+v.toPrecision(8):NaN})})),{isMatrix:true,xv,yv});openWin('sheet',sh.id);gsel={c0:0,r0:0,c1:0,r1:0,extra:new Set()};const g=plotCmd('surf3d');g.title=`z = ${a.f1}`;redrawGraph(true)}
      dirty()}catch(e){alert('Could not evaluate the expression: '+e.message)}}})}

function funcBuilderDialog(){
  const list=P.userFuncs||[];
  dialog({title:'Fitting Function Builder',sheet:{cols:[]},ok:'Save function',hint:`Define a model in <code>x</code>; every other identifier becomes a fit parameter (e.g. <code>A*exp(-k*x)+c</code>). Saved functions appear in Nonlinear Fit, Global Fit and the Quick-fit gadget.${list.length?'<br><b>Saved:</b> '+list.map(u=>esc(u.name)).join(', '):''}`,
    fields:[{t:'txt',k:'name',label:'Function name',def:'MyDecay'},{t:'txt',k:'expr',label:'Expression',def:'A*exp(-k*x)+c'},{t:'txt',k:'init',label:'Initial values (e.g. A=5,k=0.2) – optional',def:''},{t:'sel',k:'del',label:'…or delete an existing function',def:'',opts:[['','(none)'],...list.map(u=>[u.name,u.name])]}],
    onOk:a=>{if(a.del){snap();P.userFuncs=P.userFuncs.filter(u=>u.name!==a.del);registerUserFuncs();dirty();flash('Deleted '+a.del);return}
      try{const names=Mx.exprParams(a.expr);if(!names.length)throw new Error('The expression needs at least one parameter.');Mx.compile(a.expr,['x',...names])(1,...names.map(()=>1));
        const init=Object.fromEntries((a.init||'').split(/[,;]/).map(s=>s.split('=').map(t=>t.trim())).filter(q=>q.length===2&&q[0]&&q[1]!==''));
        snap();P.userFuncs=(P.userFuncs||[]).filter(u=>u.name!==a.name);P.userFuncs.push({name:a.name.replace(/\W/g,'_'),expr:a.expr,init});registerUserFuncs();dirty();flash(`Saved “${a.name}” (${names.join(', ')})`)}catch(e){alert('Invalid function: '+e.message)}}})}

function simulateDialog(){
  dialog({title:'Simulate Curve',sheet:{cols:[]},ok:'Simulate',hint:'Generates a worksheet from a model and parameter values (e.g. <code>y0=1,A=5,t=3</code>).',
    fields:[{t:'sel',k:'model',label:'Function',def:'expdec1',opts:()=>Object.entries(MODELS).map(([k,m])=>[k,m.label])},{t:'txt',k:'p',label:'Parameters',def:'y0=1,A=5,t=3'},{t:'num',k:'a',label:'X from',def:0},{t:'num',k:'b',label:'X to',def:20},{t:'num',k:'n',label:'Points',def:200},{t:'num',k:'noise',label:'Add Gaussian noise (SD)',def:0}],
    onOk:a=>{const M=MODELS[a.model],o=Object.fromEntries(a.p.split(/[,;]/).map(s=>s.split('=').map(t=>t.trim())).filter(q=>q.length===2));const p=M.names.map(n=>+o[n]);if(p.some(v=>!Number.isFinite(v)))return alert('Give a value for every parameter: '+M.names.join(', '));
      const xs=lin12(a.a,a.b,Math.max(2,Math.round(a.n)));let seed=1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;snap();
      const sh=mkSheet('Simulated',[{name:'x',des:'X',d:xs},{name:'y',des:'Y',d:xs.map(x=>+(M.f(x,p)+(a.noise?a.noise*Math.sqrt(-2*Math.log(rnd()+1e-12))*Math.cos(2*Math.PI*rnd()):0)).toPrecision(10))}]);openWin('sheet',sh.id);dirty()}})}

RIB.Plot.push(['Function',[['Function plot',IC.line,functionPlotDialog,1]]]);

def('odefit','Fitting','Fit Differential Equation (ODE)',[col('x','Time column','x'),col('y','Observed column','y'),txt('eqs','d/dt equations, one per state, separated by ;','-k*y'),txt('states','State names, comma-separated (first = observed)','y'),txt('y0','Initial values (numbers or parameter names), comma-separated','y0'),txt('init','Initial parameter values (e.g. k=0.3,y0=5)','k=0.3,y0=5'),num('obs','Observed state number',1,1),ALPHA],({x:xi,y:yi,eqs,states,y0,init,obs,alpha},ctx)=>{const{x,y}=sortedPairs(ctx,xi,yi);if(x.length<5)return warn('Need at least 5 points.');const S=states.split(',').map(s=>s.trim()).filter(Boolean),E=eqs.split(';').map(s=>s.trim()).filter(Boolean);if(S.length!==E.length)return warn('The number of equations must equal the number of states.');

<script>'use strict';
// Signal processing, round 2: IFFT, FFT filter, Hilbert, correlation, convolution, decimation, envelope, PSD/coherence, wavelets, 2D FFT.
function sigPrep(ctx,xi,yi){const p=pairs(ctx,xi,yi),n=p.y.length,d=[];for(let i=1;i<n;i++)d.push(p.x[i]-p.x[i-1]);const dt=n>1?Mx.median(d):1;return{...p,n,dt}}

def('ifft','Signal','Inverse FFT',[col('re','Real part column','y'),{...col('im','Imaginary part column (optional)','y'),none:true,noneLabel:'(none)'}],({re,im},ctx)=>{const R=cv(ctx,re),I=im>=0?cv(ctx,im):new Array(R.length).fill(0),n=Math.min(R.length,I.length),N=Mx.pow2(n),r=Mx.ifft(padTo(R.slice(0,n),N),padTo(I.slice(0,n),N));return{html:`<p>Inverse FFT of ${n} points (padded to ${N}).</p>`,cols:[{name:'IFFT real',d:Array.from(r.re).slice(0,n)},{name:'IFFT imag',d:Array.from(r.im).slice(0,n)}]}});

def('fftfilt','Signal','FFT Filter',[col('x','X (time) column','x'),col('y','Signal column','y'),sel('type','Type',[['lp','Low-pass'],['hp','High-pass'],['bp','Band-pass'],['bs','Band-stop'],['thr','Threshold (remove weak components)']],'lp'),num('f1','Cutoff 1 (frequency units, or % of max for threshold)',10,1),num('f2','Cutoff 2 (band types)',30,1),num('edge','Edge smoothness (fraction of cutoff)',0.1,0.05)],({x:xi,y:yi,type,f1,f2,edge},ctx)=>{const s=sigPrep(ctx,xi,yi);if(s.n<8)return warn('Need at least 8 points.');const N=Mx.pow2(s.n),F_=spectrum(s.y,N),fs=1/s.dt,lo=Math.min(f1,f2),hi=Math.max(f1,f2);

  const mags=Array.from({length:N/2+1},(_,k)=>Math.hypot(F_.re[k],F_.im[k])),mmax=Math.max(...mags.slice(1)),re=new Float64Array(N),im=new Float64Array(N);

def('hilbert','Signal','Hilbert Transform / Envelope',[col('x','X (time) column','x'),col('y','Signal column','y'),chk('detrend','Remove mean',true)],({x:xi,y:yi,detrend},ctx)=>{const s=sigPrep(ctx,xi,yi);if(s.n<8)return warn('Need at least 8 points.');const m=detrend?Mx.mean(s.y):0,N=Mx.pow2(s.n),F_=spectrum(s.y.map(v=>v-m),N),re=new Float64Array(N),im=new Float64Array(N);

  return{html:KV([['Samples',s.n],['Mean envelope',F(Mx.mean(env))],['Mean instantaneous frequency',F(Mx.mean(freq.slice(2,-2)))]]),cols:[{name:'Envelope',d:place(s.rows,env,ctx.nrows)},{name:'Inst. phase',unit:'rad',d:place(s.rows,ph,ctx.nrows)},{name:'Inst. frequency',d:place(s.rows,freq,ctx.nrows)}]}});

def('xcorr','Signal','Correlation (auto / cross)',[col('a','Signal A','y'),{...col('b','Signal B (blank = autocorrelation)','y'),none:true,noneLabel:'(autocorrelation)'},col('x','X (time) column for lag units','x'),num('maxlag','Maximum lag (points)',100,10),chk('norm','Normalize (coefficient)',true)],({a,b,x:xi,maxlag,norm},ctx)=>{const A_=cv(ctx,a),B_=b>=0?cv(ctx,b):A_,n=Math.min(A_.length,B_.length);if(n<4)return warn('Need ≥4 points.');const X=cv(ctx,xi),dt=X.length>1?Mx.median(X.slice(1).map((v,i)=>v-X[i])):1,ma=Mx.mean(A_),mb=Mx.mean(B_),N=Mx.pow2(2*n),Fa=spectrum(A_.slice(0,n).map(v=>v-ma),N),Fb=spectrum(B_.slice(0,n).map(v=>v-mb),N),re=new Float64Array(N),im=new Float64Array(N);
  for(let k=0;k<N;k++){re[k]=Fa.re[k]*Fb.re[k]+Fa.im[k]*Fb.im[k];im[k]=Fa.im[k]*Fb.re[k]-Fa.re[k]*Fb.im[k]}const c=Mx.ifft(re,im),L=Math.min(Math.round(maxlag),n-1),lags=[],vals=[],den=norm?Math.sqrt(Mx.sum(A_.slice(0,n).map(v=>(v-ma)**2))*Mx.sum(B_.slice(0,n).map(v=>(v-mb)**2))):1;

def('conv','Signal','Convolution',[col('a','Signal','y'),col('b','Kernel','y'),sel('mode','Output length',[['full','Full (n + m − 1)'],['same','Same as signal']],'same'),chk('norm','Normalize kernel to unit area',true)],({a,b,mode,norm},ctx)=>{const S_=cv(ctx,a),K0=cv(ctx,b),ks=Mx.sum(K0),K_=norm&&ks?K0.map(v=>v/ks):K0,n=S_.length,m=K_.length;if(n<2||m<1)return warn('Need a signal and a kernel.');const N=Mx.pow2(n+m-1),Fa=spectrum(S_,N),Fb=spectrum(K_,N),re=new Float64Array(N),im=new Float64Array(N);for(let k=0;k<N;k++){re[k]=Fa.re[k]*Fb.re[k]-Fa.im[k]*Fb.im[k];im[k]=Fa.re[k]*Fb.im[k]+Fa.im[k]*Fb.re[k]}

def('deconv','Signal','Deconvolution (Wiener)',[col('a','Measured signal','y'),col('b','Kernel / response function','y'),num('lam','Regularization λ (relative)',0.01,0.005)],({a,b,lam},ctx)=>{const S_=cv(ctx,a),K_=cv(ctx,b),n=S_.length,N=Mx.pow2(n),Fs=spectrum(S_,N),Fk=spectrum(K_,N),re=new Float64Array(N),im=new Float64Array(N),pmax=Math.max(...Array.from({length:N},(_,k)=>Fk.re[k]**2+Fk.im[k]**2)),eps=lam*pmax;
  for(let k=0;k<N;k++){const d=Fk.re[k]**2+Fk.im[k]**2+eps;re[k]=(Fs.re[k]*Fk.re[k]+Fs.im[k]*Fk.im[k])/d;im[k]=(Fs.im[k]*Fk.re[k]-Fs.re[k]*Fk.im[k])/d}return{html:`<p>Regularised (Wiener-type) deconvolution of ${n} points, λ = ${lam}.</p>`,cols:[{name:'Deconvolved',d:Array.from(Mx.ifft(re,im).re).slice(0,n)}]}});

def('decimate','Signal','Decimate (low-pass + downsample)',[col('x','X (time) column','x'),col('y','Signal column','y'),num('q','Decimation factor q',4,1),num('order','Anti-alias filter order',8,1)],({x:xi,y:yi,q,order},ctx)=>{const s=sigPrep(ctx,xi,yi);q=Math.max(2,Math.round(q));if(s.n<q*4)return warn('Signal too short for this factor.');const fs=1/s.dt,fc=.8*fs/(2*q),filt=sosFiltfilt(bwSections('lp',fc,fs,Math.min(10,Math.round(order))),s.y,true),xs=[],ys=[];for(let i=0;i<s.n;i+=q){xs.push(s.x[i]);ys.push(filt[i])}

def('envelope','Signal','Envelope Curves',[col('x','X column','x'),col('y','Signal column','y'),sel('m','Method',[['peaks','Spline through local maxima / minima'],['hilbert','Hilbert magnitude (± about the mean)']],'peaks'),num('dist','Minimum distance between extrema (points)',3,1)],({x:xi,y:yi,m,dist},ctx)=>{const s=sortedPairs(ctx,xi,yi),n=s.x.length;if(n<8)return warn('Need at least 8 points.');let up,lo;

  else{const ext=(sign)=>{const idx=[0];for(let i=1;i<n-1;i++)if(sign*s.y[i]>=sign*s.y[i-1]&&sign*s.y[i]>sign*s.y[i+1]&&i-idx[idx.length-1]>=dist)idx.push(i);idx.push(n-1);const xs=idx.map(i=>s.x[i]),ys=idx.map(i=>s.y[i]);return xs.length>=3?Mx.spline(xs,ys):Mx.linterp(xs,ys)};up=s.x.map(ext(1));lo=s.x.map(ext(-1))}

def('psd','Signal','Power Spectral Density / Coherence (Welch)',[col('x','X (time) column','x'),col('y','Signal column','y'),{...col('y2','Second signal for coherence (optional)','y'),none:true,noneLabel:'(none)'},num('seg','Segment length (points)',256,16),num('ov','Overlap (%)',50,5)],({x:xi,y:yi,y2,seg,ov},ctx)=>{const s=sigPrep(ctx,xi,yi),Y2=y2>=0?ctx.vals(y2):null;if(s.n<32)return warn('Need at least 32 points.');seg=Math.min(Mx.pow2(Math.round(seg)),Mx.pow2(s.n)>s.n?Mx.pow2(s.n)/2:Mx.pow2(s.n));const step=Math.max(1,Math.round(seg*(1-ov/100))),w=Array.from({length:seg},(_,i)=>.5-.5*Math.cos(2*Math.PI*i/(seg-1))),u=Mx.sum(w.map(v=>v*v)),h=seg/2+1,Pxx=new Array(h).fill(0),Pyy=new Array(h).fill(0),Pxy=Array.from({length:h},()=>[0,0]);let cnt=0;
  const y2v=Y2?s.rows.map(r=>Y2[r]):null;if(y2v&&y2v.some(v=>!Number.isFinite(v)))return warn('Second column has gaps within the first column\'s range.');
